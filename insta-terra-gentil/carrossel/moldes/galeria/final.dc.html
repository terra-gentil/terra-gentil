<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>F8 Chamada final: Galeria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Jost:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4ECDB}a:hover{color:#1F4A2A}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #E8A33D; color: #0B1410; font-family: 'Jost', sans-serif">
  <div style="position: absolute; inset: 0; overflow: hidden">
    <sc-if value="{{temFoto}}" hint-placeholder-val="{{false}}">
      <img src="{{foto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{foco}}; transform: {{zoomTf}}; transform-origin: {{foco}}">
    </sc-if>
    <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: {{sim}}; transform: {{zoomTf}}; transform-origin: {{foco}}"></div>
    </sc-if>
  </div>
  <div style="position: absolute; inset: 0; background: {{veu}}"></div>
  <div style="position: absolute; left: 240px; top: 140px; width: 600px; height: 330px; box-shadow: 0 0 0 1600px #E8A33D; outline: 2px solid #1F4A2A; outline-offset: -14px"></div>

  <sc-if value="{{mostrarMascote}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 400px; left: 488px; width: 104px; height: 130px; border-radius: 50%; border: 3px solid #1F4A2A; background: #F4ECDB; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px #E8A33D">
      <sc-if value="{{temMascote}}" hint-placeholder-val="{{false}}">
        <img src="{{mascote}}" alt="Mascote Doutor Gentileza" style="width: 100%; height: 100%; object-fit: cover">
      </sc-if>
      <sc-if value="{{semMascote}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #1F4A2A">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1F4A2A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 5 4 5c0 4 3 7 8 7z"/><path d="M12 10c0-3 2.5-6 8-6 0 4-3 6-8 6z"/><path d="M7 21h10"/></svg>
          <span style="font-size: 16px; font-weight: 600">mascote</span>
        </div>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{temCapaEbook}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; top: 150px; left: 455px; width: 170px; aspect-ratio: 9 / 16; z-index: 2">
      <img src="{{capaEbook}}" alt="Capa do ebook" style="display: block; width: 100%; height: 100%; object-fit: cover; box-sizing: border-box; border: 10px solid #E8A33D; border-radius: 14px; box-shadow: 0 0 0 4px #0B1410, 0 0 46px rgba(232,163,61,0.55), 0 28px 56px rgba(0,0,0,0.6)">
      <div style="position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%) rotate(-3deg); white-space: nowrap; background: #E8A33D; color: #0B1410; border: 3px solid #0B1410; border-radius: 999px; font-size: 17px; padding: 5px 12px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; box-shadow: 0 8px 18px rgba(0,0,0,0.45)">Ebook grátis</div>
    </div>
  </sc-if>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 44px 64px 48px; display: flex; flex-direction: column; align-items: center; text-align: center">
    <div style="width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 24px">
      <div style="justify-self: start; font-family: 'Bodoni Moda', serif; font-size: 30px; font-weight: 700">Terra <em style="font-weight: 400">Gentil</em></div>
      <div style="display: flex; align-items: center; gap: 16px; font-size: 22px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: #1F4A2A">
        <span style="width: 40px; height: 1px; background: #1F4A2A"></span>
        <span>{{tarja}}</span>
        <span style="width: 40px; height: 1px; background: #1F4A2A"></span>
      </div>
      <div style="justify-self: end; font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 34px">{{contador}}</div>
    </div>

    <h2 style="margin: 462px 0 0; font-family: 'Bodoni Moda', serif; font-weight: 900; font-size: 96px; line-height: 0.98; text-transform: uppercase; font-variation-settings: 'opsz' 32; -webkit-text-stroke: 1.2px #0B1410">
      <span style="display: block">{{linha1}}</span>
      <span style="display: block; font-style: italic; font-weight: 600; text-transform: none; font-size: 116px; line-height: 0.95; color: #1F4A2A; -webkit-text-stroke: 0.9px #1F4A2A">{{destaque}}</span>
      <span style="display: block; color: transparent; -webkit-text-stroke: 1.8px #0B1410">{{linha2}}</span>
    </h2>
    <p style="margin: 18px 0 0; font-size: 38px; line-height: 1.42; font-weight: 400; max-width: 820px">{{texto}}</p>

    <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 38px; font-weight: 500; line-height: 1.3">
      <div>{{ctaSalvar}}</div>
      <div style="color: #1F4A2A; font-size: 22px" aria-hidden="true">✺</div>
      <div>{{ctaSeguirA}} <strong style="font-weight: 700">{{ctaSeguirB}}</strong></div>
      <div style="color: #1F4A2A; font-size: 22px" aria-hidden="true">✺</div>
      <div>{{ctaSiteA}} <strong style="font-weight: 700">{{ctaSiteB}}</strong></div>
    </div>

    <div style="margin-top: 24px; width: 100%; padding-top: 18px; border-top: 1px solid rgba(11,20,16,0.4); display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 500">
      <div>@canalterragentil</div>
      <div style="display: flex; align-items: center; gap: 14px; font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 30px; color: #1F4A2A">
        <svg width="70" height="20" viewBox="0 0 70 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M68 10H4M12 3l-8 7 8 7"/></svg>
        <span>{{voltar}}</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tarja":{"editor":"text","default":"Para levar","section":"Texto"},"linha1":{"editor":"text","default":"Gentileza","section":"Texto"},"destaque":{"editor":"text","default":"gera","section":"Texto"},"linha2":{"editor":"text","default":"gentileza","section":"Texto"},"texto":{"editor":"text","default":"Cuide com calma e ela devolve em flores. Guarde este guia para a próxima poda.","section":"Texto"},"ctaSalvar":{"editor":"text","default":"Salve este post","section":"Texto"},"ctaSeguir":{"editor":"text","default":"Siga @canalterragentil","section":"Texto"},"ctaSite":{"editor":"text","default":"Visite terragentil.com.br","section":"Texto"},"voltar":{"editor":"text","default":"Rever do início","section":"Texto"},"contador":{"editor":"text","default":"8/8","section":"Texto"},"foto":{"editor":"text","default":"","section":"Foto"},"escurecimento":{"editor":"range","min":0,"max":90,"step":5,"default":0,"unit":"%","section":"Foto"},"zoom":{"editor":"range","min":1,"max":2.5,"step":0.05,"default":1.3,"section":"Foto"},"foco":{"editor":"enum","options":["center","top","bottom","left","right","top left","top right","bottom left","bottom right"],"default":"center","section":"Foto"},"simularFotoClara":{"editor":"boolean","default":false,"section":"Foto"},"mostrarMascote":{"editor":"boolean","default":true,"section":"Mascote"},"mascote":{"editor":"text","default":"","section":"Mascote"},"capaEbook":{"editor":"text","default":"","section":"Mascote"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = (p.foto ?? '').trim();
    const m = (p.mascote ?? '').trim();
    const k = Math.max(0, Math.min(90, p.escurecimento ?? 0)) / 100;
    const z = p.zoom ?? 1.3;
    const foco = p.foco ?? 'center';
    const D = 'radial-gradient(circle at 32% 34%, #7C9BDB 0 7%, rgba(124,155,219,0) 21%), radial-gradient(circle at 52% 26%, #9586D6 0 6%, rgba(149,134,214,0) 19%), radial-gradient(circle at 68% 46%, #6A8FD2 0 8%, rgba(106,143,210,0) 23%), radial-gradient(circle at 42% 56%, #A8BEEA 0 5%, rgba(168,190,234,0) 18%), radial-gradient(circle at 24% 58%, #8A9FE0 0 5%, rgba(138,159,224,0) 17%), radial-gradient(ellipse at 15% 85%, #3E6E3E 0 12%, rgba(62,110,62,0) 34%), radial-gradient(ellipse at 85% 80%, #2F5D33 0 14%, rgba(47,93,51,0) 36%), linear-gradient(165deg, #2E4F3A 0%, #182A20 100%)';
    const L = 'radial-gradient(circle at 32% 34%, #C9D6F5 0 7%, rgba(201,214,245,0) 21%), radial-gradient(circle at 52% 26%, #D8D0F3 0 6%, rgba(216,208,243,0) 19%), radial-gradient(circle at 68% 46%, #BFD0F1 0 8%, rgba(191,208,241,0) 23%), radial-gradient(circle at 42% 56%, #E6ECFA 0 5%, rgba(230,236,250,0) 18%), radial-gradient(circle at 24% 58%, #CBD5F3 0 5%, rgba(203,213,243,0) 17%), radial-gradient(ellipse at 15% 85%, #9CC08F 0 12%, rgba(156,192,143,0) 34%), radial-gradient(ellipse at 85% 80%, #8DB57F 0 14%, rgba(141,181,127,0) 36%), linear-gradient(165deg, #F3F4EC 0%, #CFDDC4 100%)';
    const T = {"tarja":"Para levar","linha1":"Gentileza","destaque":"gera","linha2":"gentileza","texto":"Cuide com calma e ela devolve em flores. Guarde este guia para a próxima poda.","ctaSalvar":"Salve este post","ctaSeguir":"Siga @canalterragentil","ctaSite":"Visite terragentil.com.br","voltar":"Rever do início","contador":"8/8"};
    const tx = {};
    Object.keys(T).forEach(function (c) { tx[c] = p[c] ?? T[c]; });
    const s1 = String(tx.ctaSeguir).split(' ');
    tx.ctaSeguirA = s1.shift();
    tx.ctaSeguirB = s1.join(' ');
    const s2 = String(tx.ctaSite).split(' ');
    tx.ctaSiteA = s2.shift();
    tx.ctaSiteB = s2.join(' ');
    return Object.assign(tx, {foto: f, temFoto: !!f, semFoto: !f, mascote: m, temMascote: !!m, semMascote: !m, mostrarMascote: p.mostrarMascote ?? true, capaEbook: (p.capaEbook ?? '').trim(), temCapaEbook: !!(p.capaEbook ?? '').trim(), veu: 'rgba(11,20,16,' + k + ')', zoomTf: 'scale(' + z + ')', foco: foco, sim: p.simularFotoClara ? L : D });
  }
}
</script>
</body>
</html>
