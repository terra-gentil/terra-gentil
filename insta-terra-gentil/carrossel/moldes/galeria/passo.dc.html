<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>F5 Passo 1: Galeria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Jost:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4ECDB}a:hover{color:#1F4A2A}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #E8A33D; color: #0B1410; font-family: 'Jost', sans-serif">
  <div style="position: absolute; inset: 0; overflow: hidden">
    <sc-if value="{{temFoto}}" hint-placeholder-val="{{false}}">
      <img src="{{foto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{foco}}; transform: {{zoomTf}}; transform-origin: {{foco}}">
    </sc-if>
    <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: {{sim}}; transform: {{zoomTf}}; transform-origin: {{foco}}"></div>
    </sc-if>
  </div>
  <div style="position: absolute; inset: 0; background: {{veu}}"></div>
  <div style="position: absolute; left: 48px; top: 140px; width: 984px; height: 500px; box-shadow: 0 0 0 1600px #E8A33D; outline: 2px solid #1F4A2A; outline-offset: -16px"></div>

  <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 190px; left: 96px; white-space: nowrap; border: 2px dashed rgba(244,236,219,0.8); padding: 12px 20px; font-size: 22px; font-weight: 500; background: rgba(11,20,16,0.55); color: #F4ECDB">Foto: {{legendaFoto}}</div>
  </sc-if>

  <div style="position: absolute; top: 420px; right: 90px; width: 480px; box-sizing: border-box; background: #F4ECDB; color: #1F2A22; padding: 28px 32px 30px; outline: 1px solid #1F2A22; outline-offset: -10px; box-shadow: 0 18px 40px rgba(0,0,0,0.35)">
    <div style="display: flex; align-items: center; gap: 18px">
      <div style="width: 70px; height: 86px; border-radius: 50%; border: 2px solid #8A5410; overflow: hidden; background: #E3D8BF; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{temAndre}}" hint-placeholder-val="{{false}}">
          <img src="{{fotoAndre}}" alt="André" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%">
        </sc-if>
        <sc-if value="{{semAndre}}" hint-placeholder-val="{{true}}">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#5C5236" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Foto do André" role="img"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>
        </sc-if>
      </div>
      <span style="font-family: 'Bodoni Moda', serif; font-style: italic; font-weight: 600; font-size: 44px; line-height: 1; color: #8A5410">Dica do André</span>
    </div>
    <p style="margin: 14px 0 0; font-size: 31px; line-height: 1.36; font-weight: 500">{{dica}}</p>
  </div>

  <sc-if value="{{mostrarMascote}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 560px; right: 600px; width: 104px; height: 130px; border-radius: 50%; border: 3px solid #1F4A2A; background: #F4ECDB; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px #E8A33D">
      <sc-if value="{{temMascote}}" hint-placeholder-val="{{false}}">
        <img src="{{mascote}}" alt="Mascote Doutor Gentileza" style="width: 100%; height: 100%; object-fit: cover">
      </sc-if>
      <sc-if value="{{semMascote}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #1F4A2A">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1F4A2A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 5 4 5c0 4 3 7 8 7z"/><path d="M12 10c0-3 2.5-6 8-6 0 4-3 6-8 6z"/><path d="M7 21h10"/></svg>
          <span style="font-size: 16px; font-weight: 600">mascote</span>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 44px 64px 48px; display: flex; flex-direction: column; align-items: center; text-align: center">
    <div style="width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 24px">
      <div style="justify-self: start; font-family: 'Bodoni Moda', serif; font-size: 30px; font-weight: 700">Terra <em style="font-weight: 400">Gentil</em></div>
      <div style="display: flex; align-items: center; gap: 16px; font-size: 22px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: #1F4A2A">
        <span style="width: 40px; height: 1px; background: #1F4A2A"></span>
        <span>{{tarja}}</span>
        <span style="width: 40px; height: 1px; background: #1F4A2A"></span>
      </div>
      <div style="justify-self: end; font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 34px">{{contador}}</div>
    </div>

    <h2 style="margin: auto 0 0; font-family: 'Bodoni Moda', serif; font-weight: 900; font-size: 88px; line-height: 0.98; text-transform: uppercase; font-variation-settings: 'opsz' 32; -webkit-text-stroke: 1.2px #0B1410">
      <span style="display: block">{{linha1}}</span>
      <span style="display: block; color: transparent; -webkit-text-stroke: 1.8px #0B1410">{{linha2}}</span>
      <span style="display: block; font-style: italic; font-weight: 600; text-transform: none; font-size: 120px; line-height: 0.98; color: #1F4A2A; -webkit-text-stroke: 0.9px #1F4A2A">{{destaque}}</span>
    </h2>
    <p style="margin: 24px 0 0; font-size: 38px; line-height: 1.42; font-weight: 400; max-width: 860px">{{texto}}</p>

    <div style="margin-top: 28px; width: 100%; padding-top: 18px; border-top: 1px solid rgba(11,20,16,0.4); display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 500">
      <div>@canalterragentil</div>
      <div style="display: flex; align-items: center; gap: 14px; font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 30px; color: #1F4A2A">
        <span>Deslize</span>
        <svg width="70" height="20" viewBox="0 0 70 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10h64M58 3l8 7-8 7"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tarja":{"editor":"text","default":"Passo 1","section":"Texto"},"linha1":{"editor":"text","default":"Corte logo","section":"Texto"},"linha2":{"editor":"text","default":"abaixo da","section":"Texto"},"destaque":{"editor":"text","default":"flor seca","section":"Texto"},"texto":{"editor":"text","default":"Ache o primeiro par de gemas gordinhas abaixo da flor. Corte uns 2 cm acima delas.","section":"Texto"},"dica":{"editor":"text","default":"Tesoura limpa e afiada faz corte reto. A planta cicatriza mais rápido.","section":"Texto"},"contador":{"editor":"text","default":"5/8","section":"Texto"},"legendaFoto":{"editor":"text","default":"mãos com tesoura junto à flor seca","section":"Texto"},"foto":{"editor":"text","default":"","section":"Foto"},"fotoAndre":{"editor":"text","default":"","section":"Foto"},"escurecimento":{"editor":"range","min":0,"max":90,"step":5,"default":10,"unit":"%","section":"Foto"},"zoom":{"editor":"range","min":1,"max":2.5,"step":0.05,"default":1.4,"section":"Foto"},"foco":{"editor":"enum","options":["center","top","bottom","left","right","top left","top right","bottom left","bottom right"],"default":"left","section":"Foto"},"simularFotoClara":{"editor":"boolean","default":false,"section":"Foto"},"mostrarMascote":{"editor":"boolean","default":true,"section":"Mascote"},"mascote":{"editor":"text","default":"","section":"Mascote"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = (p.foto ?? '').trim();
    const a = (p.fotoAndre ?? '').trim();
    const m = (p.mascote ?? '').trim();
    const k = Math.max(0, Math.min(90, p.escurecimento ?? 10)) / 100;
    const z = p.zoom ?? 1.4;
    const foco = p.foco ?? 'left';
    const D = 'radial-gradient(circle at 32% 34%, #7C9BDB 0 7%, rgba(124,155,219,0) 21%), radial-gradient(circle at 52% 26%, #9586D6 0 6%, rgba(149,134,214,0) 19%), radial-gradient(circle at 68% 46%, #6A8FD2 0 8%, rgba(106,143,210,0) 23%), radial-gradient(circle at 42% 56%, #A8BEEA 0 5%, rgba(168,190,234,0) 18%), radial-gradient(circle at 24% 58%, #8A9FE0 0 5%, rgba(138,159,224,0) 17%), radial-gradient(ellipse at 15% 85%, #3E6E3E 0 12%, rgba(62,110,62,0) 34%), radial-gradient(ellipse at 85% 80%, #2F5D33 0 14%, rgba(47,93,51,0) 36%), linear-gradient(165deg, #2E4F3A 0%, #182A20 100%)';
    const L = 'radial-gradient(circle at 32% 34%, #C9D6F5 0 7%, rgba(201,214,245,0) 21%), radial-gradient(circle at 52% 26%, #D8D0F3 0 6%, rgba(216,208,243,0) 19%), radial-gradient(circle at 68% 46%, #BFD0F1 0 8%, rgba(191,208,241,0) 23%), radial-gradient(circle at 42% 56%, #E6ECFA 0 5%, rgba(230,236,250,0) 18%), radial-gradient(circle at 24% 58%, #CBD5F3 0 5%, rgba(203,213,243,0) 17%), radial-gradient(ellipse at 15% 85%, #9CC08F 0 12%, rgba(156,192,143,0) 34%), radial-gradient(ellipse at 85% 80%, #8DB57F 0 14%, rgba(141,181,127,0) 36%), linear-gradient(165deg, #F3F4EC 0%, #CFDDC4 100%)';
    const T = {"tarja":"Passo 1","linha1":"Corte logo","linha2":"abaixo da","destaque":"flor seca","texto":"Ache o primeiro par de gemas gordinhas abaixo da flor. Corte uns 2 cm acima delas.","dica":"Tesoura limpa e afiada faz corte reto. A planta cicatriza mais rápido.","contador":"5/8","legendaFoto":"mãos com tesoura junto à flor seca"};
    const tx = {};
    Object.keys(T).forEach(function (c) { tx[c] = p[c] ?? T[c]; });
    return Object.assign(tx, {foto: f, temFoto: !!f, semFoto: !f, fotoAndre: a, temAndre: !!a, semAndre: !a, mascote: m, temMascote: !!m, semMascote: !m, mostrarMascote: p.mostrarMascote ?? true, veu: 'rgba(11,20,16,' + k + ')', zoomTf: 'scale(' + z + ')', foco: foco, sim: p.simularFotoClara ? L : D });
  }
}
</script>
</body>
</html>
