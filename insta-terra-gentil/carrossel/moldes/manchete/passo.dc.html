<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>A5 Passo 1: Manchete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400..800&amp;family=Caveat:wght@500..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4ECDB}a:hover{color:#E8A33D}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #1A2E22; color: #F4ECDB; font-family: 'Manrope', sans-serif">
  <div style="position: absolute; inset: 0; overflow: hidden">
    <sc-if value="{{temFoto}}" hint-placeholder-val="{{false}}">
      <img src="{{foto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{foco}}; transform: {{zoomTf}}; transform-origin: {{foco}}">
    </sc-if>
    <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: {{sim}}; transform: {{zoomTf}}; transform-origin: {{foco}}"></div>
    </sc-if>
  </div>
  <div style="position: absolute; inset: 0; background: {{veu}}"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,20,16,0.92) 0%, rgba(11,20,16,0.84) 40%, rgba(11,20,16,0.3) 60%, rgba(11,20,16,0) 72%), linear-gradient(to bottom, rgba(11,20,16,0.6) 0%, rgba(11,20,16,0) 30%)"></div>

  <div aria-hidden="true" style="position: absolute; top: 130px; left: 56px; font-family: 'Anton', sans-serif; font-size: 330px; line-height: 1; color: transparent; -webkit-text-stroke: 4px #F4ECDB">{{numero}}</div>

  <div style="position: absolute; top: 140px; right: 60px; width: 440px; transform: rotate(4deg)">
    <div aria-hidden="true" style="position: absolute; top: -22px; left: 145px; width: 150px; height: 44px; background: rgba(232,163,61,0.85); transform: rotate(-6deg)"></div>
    <div style="background: #FBF8F1; padding: 22px 22px 30px; box-shadow: 0 24px 50px rgba(0,0,0,0.4); color: #1F2A22">
      <div style="width: 396px; height: 210px; background: #CFC6AE; overflow: hidden; position: relative">
        <sc-if value="{{temAndre}}" hint-placeholder-val="{{false}}">
          <img src="{{fotoAndre}}" alt="André" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block">
        </sc-if>
        <sc-if value="{{semAndre}}" hint-placeholder-val="{{true}}">
          <div style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #5C5236; font-size: 22px; font-weight: 700">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>
            <span>Foto do André</span>
          </div>
        </sc-if>
      </div>
      <div style="margin-top: 16px; font-family: 'Caveat', cursive; font-size: 50px; font-weight: 700; color: #8A5410; line-height: 1">Dica do André</div>
      <p style="margin: 10px 0 0; font-size: 30px; line-height: 1.35; font-weight: 600">{{dica}}</p>
    </div>
  </div>

  <sc-if value="{{mostrarMascote}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 470px; right: 480px; width: 120px; height: 120px; border-radius: 50%; background: #F4ECDB; border: 4px solid #E8A33D; box-sizing: border-box; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px rgba(0,0,0,0.35); transform: rotate(-6deg)">
      <sc-if value="{{temMascote}}" hint-placeholder-val="{{false}}">
        <img src="{{mascote}}" alt="Mascote Doutor Gentileza" style="width: 100%; height: 100%; object-fit: cover">
      </sc-if>
      <sc-if value="{{semMascote}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #1F4A2A">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4A8C4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 5 4 5c0 4 3 7 8 7z"/><path d="M12 10c0-3 2.5-6 8-6 0 4-3 6-8 6z"/><path d="M7 21h10"/></svg>
          <span style="font-size: 17px; font-weight: 800">mascote</span>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 56px 64px 52px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="background: #E8A33D; color: #0B1410; padding: 12px 20px; font-size: 24px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase">{{tarja}}</div>
      <div style="background: rgba(11,20,16,0.78); padding: 10px 20px; border-radius: 999px; font-size: 26px; font-weight: 800">{{contador}}</div>
    </div>

    <h2 style="margin: auto 0 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 124px; line-height: 0.92; text-transform: uppercase; text-shadow: 0 2px 28px rgba(0,0,0,0.45)">
      <span style="display: block">{{linha1}}</span>
      <span style="display: block">{{linha2}}</span>
      <span style="display: block; font-family: 'Instrument Serif', serif; font-style: italic; text-transform: none; font-size: 168px; line-height: 0.84; color: #E8A33D">{{destaque}}</span>
    </h2>
    <p style="margin: 32px 0 0; font-size: 40px; line-height: 1.42; font-weight: 500; max-width: 900px; text-shadow: 0 1px 14px rgba(0,0,0,0.5)">{{texto}}</p>

    <div style="margin-top: 36px; padding-top: 24px; border-top: 2px solid rgba(244,236,219,0.4); display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 800">
      <div>@canalterragentil</div>
      <div style="display: flex; align-items: center; gap: 14px; letter-spacing: 0.16em; text-transform: uppercase; font-size: 24px; color: #E8A33D">
        <span>Deslize</span>
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tarja":{"editor":"text","default":"Passo 1","section":"Texto"},"numero":{"editor":"text","default":"01","section":"Texto"},"linha1":{"editor":"text","default":"Corte logo","section":"Texto"},"linha2":{"editor":"text","default":"abaixo da","section":"Texto"},"destaque":{"editor":"text","default":"flor seca","section":"Texto"},"texto":{"editor":"text","default":"Ache o primeiro par de gemas gordinhas abaixo da flor. Corte uns 2 cm acima delas.","section":"Texto"},"dica":{"editor":"text","default":"Tesoura limpa e afiada faz corte reto. A planta cicatriza mais rápido.","section":"Texto"},"contador":{"editor":"text","default":"5/8","section":"Texto"},"foto":{"editor":"text","default":"","section":"Foto"},"fotoAndre":{"editor":"text","default":"","section":"Foto"},"escurecimento":{"editor":"range","min":0,"max":90,"step":5,"default":25,"unit":"%","section":"Foto"},"zoom":{"editor":"range","min":1,"max":2.5,"step":0.05,"default":1.3,"section":"Foto"},"foco":{"editor":"enum","options":["center","top","bottom","left","right","top left","top right","bottom left","bottom right"],"default":"left","section":"Foto"},"simularFotoClara":{"editor":"boolean","default":false,"section":"Foto"},"mostrarMascote":{"editor":"boolean","default":true,"section":"Mascote"},"mascote":{"editor":"text","default":"","section":"Mascote"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = (p.foto ?? '').trim();
    const m = (p.mascote ?? '').trim();
    const a = (p.fotoAndre ?? '').trim();
    const k = Math.max(0, Math.min(90, p.escurecimento ?? 25)) / 100;
    const z = p.zoom ?? 1.3;
    const foco = p.foco ?? 'left';
    const D = 'radial-gradient(circle at 32% 34%, #7C9BDB 0 7%, rgba(124,155,219,0) 21%), radial-gradient(circle at 52% 26%, #9586D6 0 6%, rgba(149,134,214,0) 19%), radial-gradient(circle at 68% 46%, #6A8FD2 0 8%, rgba(106,143,210,0) 23%), radial-gradient(circle at 42% 56%, #A8BEEA 0 5%, rgba(168,190,234,0) 18%), radial-gradient(circle at 24% 58%, #8A9FE0 0 5%, rgba(138,159,224,0) 17%), radial-gradient(ellipse at 15% 85%, #3E6E3E 0 12%, rgba(62,110,62,0) 34%), radial-gradient(ellipse at 85% 80%, #2F5D33 0 14%, rgba(47,93,51,0) 36%), linear-gradient(165deg, #2E4F3A 0%, #182A20 100%)';
    const L = 'radial-gradient(circle at 32% 34%, #C9D6F5 0 7%, rgba(201,214,245,0) 21%), radial-gradient(circle at 52% 26%, #D8D0F3 0 6%, rgba(216,208,243,0) 19%), radial-gradient(circle at 68% 46%, #BFD0F1 0 8%, rgba(191,208,241,0) 23%), radial-gradient(circle at 42% 56%, #E6ECFA 0 5%, rgba(230,236,250,0) 18%), radial-gradient(circle at 24% 58%, #CBD5F3 0 5%, rgba(203,213,243,0) 17%), radial-gradient(ellipse at 15% 85%, #9CC08F 0 12%, rgba(156,192,143,0) 34%), radial-gradient(ellipse at 85% 80%, #8DB57F 0 14%, rgba(141,181,127,0) 36%), linear-gradient(165deg, #F3F4EC 0%, #CFDDC4 100%)';
    const T = {"tarja":"Passo 1","numero":"01","linha1":"Corte logo","linha2":"abaixo da","destaque":"flor seca","texto":"Ache o primeiro par de gemas gordinhas abaixo da flor. Corte uns 2 cm acima delas.","dica":"Tesoura limpa e afiada faz corte reto. A planta cicatriza mais rápido.","contador":"5/8"};
    const tx = {};
    Object.keys(T).forEach(function (c) { tx[c] = p[c] ?? T[c]; });
    return Object.assign(tx, {mascote: m, temMascote: !!m, semMascote: !m, mostrarMascote: p.mostrarMascote ?? true, foto: f, temFoto: !!f, semFoto: !f, fotoAndre: a, temAndre: !!a, semAndre: !a, veu: 'rgba(11,20,16,' + k + ')', zoomTf: 'scale(' + z + ')', foco: foco, sim: p.simularFotoClara ? L : D });
  }
}
</script>
</body>
</html>
