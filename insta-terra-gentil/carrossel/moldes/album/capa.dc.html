<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>C1 Capa: Álbum</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Fraunces:ital,opsz,wght@1,9..144,400..600&amp;family=Caveat:wght@500..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4ECDB}a:hover{color:#E8A33D}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #1A2E22; color: #F4ECDB; font-family: 'Bricolage Grotesque', sans-serif">
  <div style="position: absolute; inset: 0; overflow: hidden">
    <sc-if value="{{temFoto}}" hint-placeholder-val="{{false}}">
      <img src="{{foto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{foco}}; transform: {{zoomTf}}; transform-origin: {{foco}}">
    </sc-if>
    <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: {{sim}}; transform: {{zoomTf}}; transform-origin: {{foco}}"></div>
    </sc-if>
  </div>
  <div style="position: absolute; inset: 0; background: {{veu}}"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(16,48,26,0.9) 0%, rgba(16,48,26,0.82) 38%, rgba(16,48,26,0) 58%), linear-gradient(to top, rgba(16,48,26,0.75) 0%, rgba(16,48,26,0) 20%)"></div>

  <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 860px; right: 64px; display: flex; align-items: center; gap: 12px; background: rgba(16,48,26,0.7); border: 2px dashed rgba(244,236,219,0.6); border-radius: 12px; padding: 12px 20px; font-size: 22px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/></svg>
      <span>Foto: {{legendaFoto}}</span>
    </div>
  </sc-if>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 52px 64px 52px; display: flex; flex-direction: column; align-items: center; text-align: center">
    <div style="width: 100%; display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 10 5 20 4c0 10-5 15-14 15z"/><path d="M5 19l8-8"/></svg>
        <span>terra gentil</span>
      </div>
      <div style="font-size: 28px; font-weight: 800">{{contador}}</div>
    </div>

    <h1 style="margin: 60px 0 0; font-weight: 800; font-size: 104px; line-height: 0.94; letter-spacing: -0.03em; text-transform: uppercase; font-variation-settings: 'opsz' 96; text-shadow: 0 2px 24px rgba(0,0,0,0.4)">
      <span style="display: block">{{linha1}}</span>
      <span style="display: block">{{linha2}}</span>
      <span style="display: block; font-size: 84px; letter-spacing: 0; color: transparent; -webkit-text-stroke: 2.5px #F4ECDB; text-shadow: none; margin-top: 6px">{{linha3}}</span>
      <span style="display: block; font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; text-transform: none; font-size: 150px; line-height: 0.95; letter-spacing: -0.02em; color: #E8A33D">{{destaque}}</span>
    </h1>

    <div style="margin-top: auto; align-self: flex-start; background: #4A8C4F; color: #0B1410; padding: 10px 26px; font-size: 26px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; transform: rotate(-2deg); box-shadow: 0 6px 16px rgba(0,0,0,0.25)">{{tarja}}</div>

    <div style="margin-top: 28px; width: 100%; display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 28px; font-weight: 800">@canalterragentil</div>
      <div style="display: flex; gap: 8px; align-items: center" aria-hidden="true">
        <sc-for list="{{pontos}}" as="pt" hint-placeholder-count="8">
          <span style="height: 10px; border-radius: 5px; width: {{pt.w}}; background: {{pt.cor}}"></span>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; background: #E8A33D; color: #0B1410; border-radius: 999px; padding: 12px 18px 12px 26px; font-size: 26px; font-weight: 800">
        <span>Deslize</span>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tarja":{"editor":"text","default":"Jardinagem ✺ Poda","section":"Texto"},"linha1":{"editor":"text","default":"Como podar","section":"Texto"},"linha2":{"editor":"text","default":"hortênsia","section":"Texto"},"linha3":{"editor":"text","default":"sem perder as","section":"Texto"},"destaque":{"editor":"text","default":"flores","section":"Texto"},"contador":{"editor":"text","default":"1/8","section":"Texto"},"legendaFoto":{"editor":"text","default":"hortênsia azul em flor, close, luz natural","section":"Texto"},"foto":{"editor":"text","default":"","section":"Foto"},"escurecimento":{"editor":"range","min":0,"max":90,"step":5,"default":5,"unit":"%","section":"Foto"},"zoom":{"editor":"range","min":1,"max":2.5,"step":0.05,"default":1,"section":"Foto"},"foco":{"editor":"enum","options":["center","top","bottom","left","right","top left","top right","bottom left","bottom right"],"default":"bottom","section":"Foto"},"simularFotoClara":{"editor":"boolean","default":false,"section":"Foto"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = (p.foto ?? '').trim();
    const k = Math.max(0, Math.min(90, p.escurecimento ?? 5)) / 100;
    const z = p.zoom ?? 1;
    const foco = p.foco ?? 'bottom';
    const D = 'radial-gradient(circle at 32% 34%, #7C9BDB 0 7%, rgba(124,155,219,0) 21%), radial-gradient(circle at 52% 26%, #9586D6 0 6%, rgba(149,134,214,0) 19%), radial-gradient(circle at 68% 46%, #6A8FD2 0 8%, rgba(106,143,210,0) 23%), radial-gradient(circle at 42% 56%, #A8BEEA 0 5%, rgba(168,190,234,0) 18%), radial-gradient(circle at 24% 58%, #8A9FE0 0 5%, rgba(138,159,224,0) 17%), radial-gradient(ellipse at 15% 85%, #3E6E3E 0 12%, rgba(62,110,62,0) 34%), radial-gradient(ellipse at 85% 80%, #2F5D33 0 14%, rgba(47,93,51,0) 36%), linear-gradient(165deg, #2E4F3A 0%, #182A20 100%)';
    const L = 'radial-gradient(circle at 32% 34%, #C9D6F5 0 7%, rgba(201,214,245,0) 21%), radial-gradient(circle at 52% 26%, #D8D0F3 0 6%, rgba(216,208,243,0) 19%), radial-gradient(circle at 68% 46%, #BFD0F1 0 8%, rgba(191,208,241,0) 23%), radial-gradient(circle at 42% 56%, #E6ECFA 0 5%, rgba(230,236,250,0) 18%), radial-gradient(circle at 24% 58%, #CBD5F3 0 5%, rgba(203,213,243,0) 17%), radial-gradient(ellipse at 15% 85%, #9CC08F 0 12%, rgba(156,192,143,0) 34%), radial-gradient(ellipse at 85% 80%, #8DB57F 0 14%, rgba(141,181,127,0) 36%), linear-gradient(165deg, #F3F4EC 0%, #CFDDC4 100%)';
    const T = {"tarja":"Jardinagem ✺ Poda","linha1":"Como podar","linha2":"hortênsia","linha3":"sem perder as","destaque":"flores","contador":"1/8","legendaFoto":"hortênsia azul em flor, close, luz natural"};
    const tx = {};
    Object.keys(T).forEach(function (c) { tx[c] = p[c] ?? T[c]; });
    const pc = String(tx.contador).split('/');
    const atual = parseInt(pc[0], 10) || 1;
    const total = parseInt(pc[1], 10) || 8;
    tx.pontos = Array.from({ length: total }, function (_, i) { return i + 1 === atual ? { w: '34px', cor: '#E8A33D' } : { w: '10px', cor: 'rgba(244,236,219,0.55)' }; });
    return Object.assign(tx, {foto: f, temFoto: !!f, semFoto: !f, veu: 'rgba(16,48,26,' + k + ')', zoomTf: 'scale(' + z + ')', foco: foco, sim: p.simularFotoClara ? L : D });
  }
}
</script>
</body>
</html>
