name: Coletar pauta de noticias

# Quem dispara e o TriggerAll (cron antes da routine das 04:00 BRT), nao um schedule aqui.
# A routine roda num sandbox sem rede: a coleta dos feeds acontece aqui e vira um JSON no repo.
on:
  workflow_dispatch:

permissions:
  contents: write

# Mesmo grupo do publish-instagram: os dois empurram na main e nao podem se atropelar.
concurrency:
  group: insta-rotina
  cancel-in-progress: false

jobs:
  coletar:
    name: Coletar os feeds e gravar a pauta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Coletar
        run: node insta-terra-gentil/pauta/coletar-cli.mjs

      # So commita se a pauta mudou. [skip ci] evita rodar o CI do site por um JSON de dados.
      - name: Commitar a pauta
        run: |
          if git diff --quiet -- insta-terra-gentil/dados/pauta-noticias.json && [ -z "$(git ls-files --others --exclude-standard insta-terra-gentil/dados/pauta-noticias.json)" ]; then
            echo "Pauta sem mudanca, nada a commitar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insta-terra-gentil/dados/pauta-noticias.json
          git commit -m "Pauta de noticias: coleta automatica [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
