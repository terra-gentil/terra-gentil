<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>G8 Chamada final: Lambe-lambe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&amp;family=EB+Garamond:ital,wght@1,600..800&amp;family=Nunito+Sans:opsz,wght@6..12,600..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4ECDB}a:hover{color:#E8A33D}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #1A2E22; color: #F4ECDB; font-family: 'Nunito Sans', sans-serif">
  <div style="position: absolute; inset: 0; overflow: hidden">
    <sc-if value="{{temFoto}}" hint-placeholder-val="{{false}}">
      <img src="{{foto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{foco}}; transform: {{zoomTf}}; transform-origin: {{foco}}; filter: saturate(1.25) contrast(1.08)">
    </sc-if>
    <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: {{sim}}; transform: {{zoomTf}}; transform-origin: {{foco}}; filter: saturate(1.25) contrast(1.08)"></div>
    </sc-if>
  </div>
  <div style="position: absolute; inset: 0; background: {{veu}}"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(11,20,16,0) 40%, rgba(11,20,16,0.7) 100%)"></div>

  <sc-if value="{{mostrarMascote}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 190px; right: 64px; width: 170px; height: 170px; border-radius: 50%; box-sizing: border-box; border: 5px solid #0B1410; background: #F4ECDB; box-shadow: 6px 6px 0 #0B1410; overflow: hidden; transform: rotate(10deg); display: flex; align-items: center; justify-content: center">
      <sc-if value="{{temMascote}}" hint-placeholder-val="{{false}}">
        <img src="{{mascote}}" alt="Mascote Doutor Gentileza" style="width: 100%; height: 100%; object-fit: cover">
      </sc-if>
      <sc-if value="{{semMascote}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #1F4A2A">
          <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#1F4A2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 5 4 5c0 4 3 7 8 7z"/><path d="M12 10c0-3 2.5-6 8-6 0 4-3 6-8 6z"/><path d="M7 21h10"/></svg>
          <span style="font-size: 20px; font-weight: 900">mascote</span>
        </div>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{temCapaEbook}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; top: 170px; right: 64px; width: 200px; transform: rotate(8deg); aspect-ratio: 9 / 16; z-index: 2">
      <img src="{{capaEbook}}" alt="Capa do ebook" style="display: block; width: 100%; height: 100%; object-fit: cover; box-sizing: border-box; border: 6px solid #F4ECDB; border-radius: 12px; box-shadow: 0 26px 50px rgba(0,0,0,0.55)">
    </div>
  </sc-if>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 56px 60px 52px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="background: #4A8C4F; color: #0B1410; border: 4px solid #0B1410; border-radius: 999px; box-shadow: 5px 5px 0 #0B1410; padding: 10px 26px; font-size: 26px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; transform: rotate(-3deg)">{{tarja}}</div>
      <div style="width: 96px; height: 96px; border-radius: 50%; background: #F4ECDB; color: #0B1410; border: 4px solid #0B1410; box-sizing: border-box; box-shadow: 5px 5px 0 #0B1410; display: flex; align-items: center; justify-content: center; font-family: 'Bowlby One', sans-serif; font-size: 28px; transform: rotate(8deg)">{{contador}}</div>
    </div>

    <h2 style="margin: 70px 0 0; font-family: 'Bowlby One', sans-serif; font-weight: 400; font-size: 108px; line-height: 1.02; text-transform: uppercase; text-shadow: 6px 6px 0 #0B1410; color: #E8A33D">
      <span style="display: block; transform: rotate(-2deg); transform-origin: left">{{linha1}}</span>
      <span style="display: inline-block; position: relative; font-family: 'EB Garamond', serif; font-style: italic; font-weight: 800; text-transform: none; font-size: 140px; line-height: 0.95; color: #F4ECDB; transform: rotate(-3deg); transform-origin: left">{{destaque}}<svg style="position: absolute; left: 0; bottom: -14px; width: 100%; height: 28px" viewBox="0 0 300 30" preserveAspectRatio="none" fill="none" stroke="#E8A33D" stroke-width="6" stroke-linecap="round" aria-hidden="true"><path d="M4 18C60 6 120 26 180 12S270 8 296 16"/></svg></span>
      <span style="display: block; color: transparent; -webkit-text-stroke: 3px #E8A33D; transform: rotate(1deg); transform-origin: left">{{linha2}}</span>
    </h2>
    <p style="margin: 40px 0 0; align-self: flex-start; max-width: 900px; box-sizing: border-box; background: #F4ECDB; color: #0B1410; border: 4px solid #0B1410; box-shadow: 6px 6px 0 #0B1410; padding: 20px 26px; font-size: 38px; line-height: 1.4; font-weight: 700; transform: rotate(-1deg)">{{texto}}</p>

    <div style="margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 16px">
      <div style="display: flex; align-items: center; gap: 16px; background: #E8A33D; color: #0B1410; border: 4px solid #0B1410; box-shadow: 5px 5px 0 #0B1410; border-radius: 999px; padding: 14px 30px 14px 20px; font-size: 38px; font-weight: 900; transform: rotate(-1.5deg)">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
        <span>{{ctaSalvar}}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; background: #F4ECDB; color: #0B1410; border: 4px solid #0B1410; box-shadow: 5px 5px 0 #0B1410; border-radius: 999px; padding: 14px 30px 14px 20px; font-size: 38px; font-weight: 900; transform: rotate(1deg)">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg>
        <span>{{ctaSeguir}}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; background: #4A8C4F; color: #0B1410; border: 4px solid #0B1410; box-shadow: 5px 5px 0 #0B1410; border-radius: 999px; padding: 14px 30px 14px 20px; font-size: 38px; font-weight: 900; transform: rotate(-1deg)">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
        <span>{{ctaSite}}</span>
      </div>
    </div>

    <div style="margin-top: 32px; display: flex; justify-content: space-between; align-items: center">
      <div style="background: #0B1410; color: #F4ECDB; border-radius: 999px; padding: 12px 24px; font-size: 26px; font-weight: 900">@canalterragentil</div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; text-shadow: 3px 3px 0 #0B1410">
        <svg width="110" height="56" viewBox="0 0 110 56" fill="none" stroke="#F4ECDB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M104 40C80 10 50 50 14 22"/><path d="M30 14l-18 6 6 18"/></svg>
        <span>{{voltar}}</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tarja":{"editor":"text","default":"Para levar","section":"Texto"},"linha1":{"editor":"text","default":"Gentileza","section":"Texto"},"destaque":{"editor":"text","default":"gera","section":"Texto"},"linha2":{"editor":"text","default":"gentileza","section":"Texto"},"texto":{"editor":"text","default":"Cuide com calma e ela devolve em flores. Guarde este guia para a próxima poda.","section":"Texto"},"ctaSalvar":{"editor":"text","default":"Salve este post","section":"Texto"},"ctaSeguir":{"editor":"text","default":"Siga @canalterragentil","section":"Texto"},"ctaSite":{"editor":"text","default":"Visite terragentil.com.br","section":"Texto"},"voltar":{"editor":"text","default":"Rever do início","section":"Texto"},"contador":{"editor":"text","default":"8/8","section":"Texto"},"foto":{"editor":"text","default":"","section":"Foto"},"escurecimento":{"editor":"range","min":0,"max":90,"step":5,"default":45,"unit":"%","section":"Foto"},"zoom":{"editor":"range","min":1,"max":2.5,"step":0.05,"default":1.8,"section":"Foto"},"foco":{"editor":"enum","options":["center","top","bottom","left","right","top left","top right","bottom left","bottom right"],"default":"bottom right","section":"Foto"},"simularFotoClara":{"editor":"boolean","default":false,"section":"Foto"},"mostrarMascote":{"editor":"boolean","default":true,"section":"Mascote"},"mascote":{"editor":"text","default":"","section":"Mascote"},"capaEbook":{"editor":"text","default":"","section":"Mascote"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = (p.foto ?? '').trim();
    const m = (p.mascote ?? '').trim();
    const k = Math.max(0, Math.min(90, p.escurecimento ?? 45)) / 100;
    const z = p.zoom ?? 1.8;
    const foco = p.foco ?? 'bottom right';
    const D = 'radial-gradient(circle at 32% 34%, #7C9BDB 0 7%, rgba(124,155,219,0) 21%), radial-gradient(circle at 52% 26%, #9586D6 0 6%, rgba(149,134,214,0) 19%), radial-gradient(circle at 68% 46%, #6A8FD2 0 8%, rgba(106,143,210,0) 23%), radial-gradient(circle at 42% 56%, #A8BEEA 0 5%, rgba(168,190,234,0) 18%), radial-gradient(circle at 24% 58%, #8A9FE0 0 5%, rgba(138,159,224,0) 17%), radial-gradient(ellipse at 15% 85%, #3E6E3E 0 12%, rgba(62,110,62,0) 34%), radial-gradient(ellipse at 85% 80%, #2F5D33 0 14%, rgba(47,93,51,0) 36%), linear-gradient(165deg, #2E4F3A 0%, #182A20 100%)';
    const L = 'radial-gradient(circle at 32% 34%, #C9D6F5 0 7%, rgba(201,214,245,0) 21%), radial-gradient(circle at 52% 26%, #D8D0F3 0 6%, rgba(216,208,243,0) 19%), radial-gradient(circle at 68% 46%, #BFD0F1 0 8%, rgba(191,208,241,0) 23%), radial-gradient(circle at 42% 56%, #E6ECFA 0 5%, rgba(230,236,250,0) 18%), radial-gradient(circle at 24% 58%, #CBD5F3 0 5%, rgba(203,213,243,0) 17%), radial-gradient(ellipse at 15% 85%, #9CC08F 0 12%, rgba(156,192,143,0) 34%), radial-gradient(ellipse at 85% 80%, #8DB57F 0 14%, rgba(141,181,127,0) 36%), linear-gradient(165deg, #F3F4EC 0%, #CFDDC4 100%)';
    const T = {"tarja":"Para levar","linha1":"Gentileza","destaque":"gera","linha2":"gentileza","texto":"Cuide com calma e ela devolve em flores. Guarde este guia para a próxima poda.","ctaSalvar":"Salve este post","ctaSeguir":"Siga @canalterragentil","ctaSite":"Visite terragentil.com.br","voltar":"Rever do início","contador":"8/8"};
    const tx = {};
    Object.keys(T).forEach(function (c) { tx[c] = p[c] ?? T[c]; });
    return Object.assign(tx, {foto: f, temFoto: !!f, semFoto: !f, mascote: m, temMascote: !!m, semMascote: !m, mostrarMascote: p.mostrarMascote ?? true, capaEbook: (p.capaEbook ?? '').trim(), temCapaEbook: !!(p.capaEbook ?? '').trim(), veu: 'rgba(11,20,16,' + k + ')', zoomTf: 'scale(' + z + ')', foco: foco, sim: p.simularFotoClara ? L : D });
  }
}
</script>
</body>
</html>
