<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>C8 Chamada final: Álbum</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Fraunces:ital,opsz,wght@1,9..144,400..600&amp;family=Caveat:wght@500..700&amp;family=Anton&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4ECDB}a:hover{color:#E8A33D}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #1A2E22; color: #F4ECDB; font-family: 'Bricolage Grotesque', sans-serif">
  <div style="position: absolute; inset: 0; overflow: hidden">
    <sc-if value="{{temFoto}}" hint-placeholder-val="{{false}}">
      <img src="{{foto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{foco}}; transform: {{zoomTf}}; transform-origin: {{foco}}">
    </sc-if>
    <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: {{sim}}; transform: {{zoomTf}}; transform-origin: {{foco}}"></div>
    </sc-if>
  </div>
  <div style="position: absolute; inset: 0; background: {{veu}}"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(16,48,26,0.7) 0%, rgba(16,48,26,0) 45%)"></div>

  <sc-if value="{{mostrarMascote}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 140px; right: 64px; width: 300px; transform: rotate(5deg)">
      <div aria-hidden="true" style="position: absolute; top: -18px; left: 85px; width: 130px; height: 40px; background: rgba(74,140,79,0.92); transform: rotate(-6deg); z-index: 1"></div>
      <div style="background: #FBF8F1; padding: 18px 18px 16px; box-shadow: 0 24px 50px rgba(0,0,0,0.45)">
        <div style="width: 264px; height: 240px; background: #E9E1CC; overflow: hidden; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{temMascote}}" hint-placeholder-val="{{false}}">
            <img src="{{mascote}}" alt="Mascote Doutor Gentileza" style="width: 100%; height: 100%; object-fit: contain">
          </sc-if>
          <sc-if value="{{semMascote}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #1F4A2A; text-align: center">
              <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#4A8C4F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 5 4 5c0 4 3 7 8 7z"/><path d="M12 10c0-3 2.5-6 8-6 0 4-3 6-8 6z"/><path d="M7 21h10"/></svg>
              <span style="font-size: 20px; font-weight: 700">mascote</span>
            </div>
          </sc-if>
        </div>
        <div style="margin-top: 8px; font-family: 'Caveat', cursive; font-size: 38px; font-weight: 700; color: #1F2A22; line-height: 1; text-align: center">Doutor Gentileza</div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{temCapaEbook}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; top: 120px; right: 70px; width: 230px; transform: rotate(5deg); aspect-ratio: 9 / 16; z-index: 2">
      <img src="{{capaEbook}}" alt="Capa do ebook" style="display: block; width: 100%; height: 100%; object-fit: cover; box-sizing: border-box; border: 6px solid #F4ECDB; border-radius: 12px; box-shadow: 0 26px 50px rgba(0,0,0,0.55)">
    </div>
  </sc-if>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 52px 64px 52px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 10 5 20 4c0 10-5 15-14 15z"/><path d="M5 19l8-8"/></svg>
        <span>terra gentil</span>
      </div>
      <div style="font-size: 28px; font-weight: 800">{{contador}}</div>
    </div>

    <div style="margin-top: 70px; align-self: flex-start; background: #4A8C4F; color: #0B1410; padding: 10px 26px; font-size: 26px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; transform: rotate(-2deg)">{{tarja}}</div>
    <h2 style="margin: 28px 0 0; font-weight: 800; font-size: 112px; line-height: 0.94; letter-spacing: -0.03em; text-transform: uppercase; font-variation-settings: 'opsz' 96; text-shadow: 0 2px 24px rgba(0,0,0,0.4)">
      <span style="display: block">{{linha1}}</span>
      <span style="display: block; font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; text-transform: none; font-size: 150px; line-height: 0.95; letter-spacing: -0.02em; color: #E8A33D">{{destaque}}</span>
      <span style="display: block; font-family: 'Anton', sans-serif; font-weight: 400; font-variation-settings: normal; letter-spacing: 0.01em; font-size: 1.12em; color: transparent; -webkit-text-stroke: 2.5px #F4ECDB; text-shadow: none">{{linha2}}</span>
    </h2>
    <p style="margin: 28px 0 0; font-size: 40px; line-height: 1.42; font-weight: 500; max-width: 900px; text-shadow: 0 1px 14px rgba(0,0,0,0.5)">{{texto}}</p>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 22px; background: rgba(16,48,26,0.82); border-radius: 999px; padding: 14px 32px 14px 14px">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: #E8A33D; color: #0B1410; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
        </div>
        <span style="font-size: 38px; font-weight: 800">{{ctaSalvar}}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 22px; background: rgba(16,48,26,0.82); border-radius: 999px; padding: 14px 32px 14px 14px">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: #E8A33D; color: #0B1410; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg>
        </div>
        <span style="font-size: 38px; font-weight: 800">{{ctaSeguir}}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 22px; background: rgba(16,48,26,0.82); border-radius: 999px; padding: 14px 32px 14px 14px">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: #E8A33D; color: #0B1410; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
        </div>
        <span style="font-size: 38px; font-weight: 800">{{ctaSite}}</span>
      </div>
    </div>

    <div style="margin-top: 32px; width: 100%; display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 28px; font-weight: 800">@canalterragentil</div>
      <div style="display: flex; gap: 8px; align-items: center" aria-hidden="true">
        <sc-for list="{{pontos}}" as="pt" hint-placeholder-count="8">
          <span style="height: 10px; border-radius: 5px; width: {{pt.w}}; background: {{pt.cor}}"></span>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; background: #E8A33D; color: #0B1410; border-radius: 999px; padding: 12px 26px 12px 18px; font-size: 26px; font-weight: 800">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        <span>{{voltar}}</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tarja":{"editor":"text","default":"Para levar","section":"Texto"},"linha1":{"editor":"text","default":"Gentileza","section":"Texto"},"destaque":{"editor":"text","default":"gera","section":"Texto"},"linha2":{"editor":"text","default":"gentileza","section":"Texto"},"texto":{"editor":"text","default":"Cuide com calma e ela devolve em flores. Guarde este guia para a próxima poda.","section":"Texto"},"ctaSalvar":{"editor":"text","default":"Salve este post","section":"Texto"},"ctaSeguir":{"editor":"text","default":"Siga @canalterragentil","section":"Texto"},"ctaSite":{"editor":"text","default":"Visite terragentil.com.br","section":"Texto"},"voltar":{"editor":"text","default":"Rever","section":"Texto"},"contador":{"editor":"text","default":"8/8","section":"Texto"},"foto":{"editor":"text","default":"","section":"Foto"},"escurecimento":{"editor":"range","min":0,"max":90,"step":5,"default":65,"unit":"%","section":"Foto"},"zoom":{"editor":"range","min":1,"max":2.5,"step":0.05,"default":1.6,"section":"Foto"},"foco":{"editor":"enum","options":["center","top","bottom","left","right","top left","top right","bottom left","bottom right"],"default":"center","section":"Foto"},"simularFotoClara":{"editor":"boolean","default":false,"section":"Foto"},"mostrarMascote":{"editor":"boolean","default":true,"section":"Mascote"},"mascote":{"editor":"text","default":"","section":"Mascote"},"capaEbook":{"editor":"text","default":"","section":"Mascote"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = (p.foto ?? '').trim();
    const m = (p.mascote ?? '').trim();
    const k = Math.max(0, Math.min(90, p.escurecimento ?? 65)) / 100;
    const z = p.zoom ?? 1.6;
    const foco = p.foco ?? 'center';
    const D = 'radial-gradient(circle at 32% 34%, #7C9BDB 0 7%, rgba(124,155,219,0) 21%), radial-gradient(circle at 52% 26%, #9586D6 0 6%, rgba(149,134,214,0) 19%), radial-gradient(circle at 68% 46%, #6A8FD2 0 8%, rgba(106,143,210,0) 23%), radial-gradient(circle at 42% 56%, #A8BEEA 0 5%, rgba(168,190,234,0) 18%), radial-gradient(circle at 24% 58%, #8A9FE0 0 5%, rgba(138,159,224,0) 17%), radial-gradient(ellipse at 15% 85%, #3E6E3E 0 12%, rgba(62,110,62,0) 34%), radial-gradient(ellipse at 85% 80%, #2F5D33 0 14%, rgba(47,93,51,0) 36%), linear-gradient(165deg, #2E4F3A 0%, #182A20 100%)';
    const L = 'radial-gradient(circle at 32% 34%, #C9D6F5 0 7%, rgba(201,214,245,0) 21%), radial-gradient(circle at 52% 26%, #D8D0F3 0 6%, rgba(216,208,243,0) 19%), radial-gradient(circle at 68% 46%, #BFD0F1 0 8%, rgba(191,208,241,0) 23%), radial-gradient(circle at 42% 56%, #E6ECFA 0 5%, rgba(230,236,250,0) 18%), radial-gradient(circle at 24% 58%, #CBD5F3 0 5%, rgba(203,213,243,0) 17%), radial-gradient(ellipse at 15% 85%, #9CC08F 0 12%, rgba(156,192,143,0) 34%), radial-gradient(ellipse at 85% 80%, #8DB57F 0 14%, rgba(141,181,127,0) 36%), linear-gradient(165deg, #F3F4EC 0%, #CFDDC4 100%)';
    const T = {"tarja":"Para levar","linha1":"Gentileza","destaque":"gera","linha2":"gentileza","texto":"Cuide com calma e ela devolve em flores. Guarde este guia para a próxima poda.","ctaSalvar":"Salve este post","ctaSeguir":"Siga @canalterragentil","ctaSite":"Visite terragentil.com.br","voltar":"Rever","contador":"8/8"};
    const tx = {};
    Object.keys(T).forEach(function (c) { tx[c] = p[c] ?? T[c]; });
    const pc = String(tx.contador).split('/');
    const atual = parseInt(pc[0], 10) || 1;
    const total = parseInt(pc[1], 10) || 8;
    tx.pontos = Array.from({ length: total }, function (_, i) { return i + 1 === atual ? { w: '34px', cor: '#E8A33D' } : { w: '10px', cor: 'rgba(244,236,219,0.55)' }; });
    return Object.assign(tx, {foto: f, temFoto: !!f, semFoto: !f, mascote: m, temMascote: !!m, semMascote: !m, mostrarMascote: p.mostrarMascote ?? true, capaEbook: (p.capaEbook ?? '').trim(), temCapaEbook: !!(p.capaEbook ?? '').trim(), veu: 'rgba(16,48,26,' + k + ')', zoomTf: 'scale(' + z + ')', foco: foco, sim: p.simularFotoClara ? L : D });
  }
}
</script>
</body>
</html>
