<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>D8 Chamada final: Duotom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800;900&amp;family=Playfair+Display:ital,wght@1,700..900&amp;family=Work+Sans:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4ECDB}a:hover{color:#F4ECDB}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #0B1410; color: #F4ECDB; font-family: 'Work Sans', sans-serif">
  <div style="position: absolute; inset: 0; overflow: hidden">
    <sc-if value="{{temFoto}}" hint-placeholder-val="{{false}}">
      <img src="{{foto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{foco}}; transform: {{zoomTf}}; transform-origin: {{foco}}; filter: grayscale(1) contrast(1.15)">
    </sc-if>
    <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: {{sim}}; transform: {{zoomTf}}; transform-origin: {{foco}}; filter: grayscale(1) contrast(1.15)"></div>
    </sc-if>
    <div style="position: absolute; inset: 0; background: #E8A33D; mix-blend-mode: multiply"></div>
  </div>
  <div style="position: absolute; inset: 0; background: {{veu}}"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,20,16,0.85) 0%, rgba(11,20,16,0.4) 60%, rgba(11,20,16,0.2) 100%)"></div>

  <sc-if value="{{mostrarMascote}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 170px; right: 64px; width: 190px; height: 190px; box-sizing: border-box; border: 4px solid #F4ECDB; background: #F4ECDB; overflow: hidden; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{temMascote}}" hint-placeholder-val="{{false}}">
        <img src="{{mascote}}" alt="Mascote Doutor Gentileza" style="width: 100%; height: 100%; object-fit: cover">
      </sc-if>
      <sc-if value="{{semMascote}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #1F4A2A">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#4A8C4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 5 4 5c0 4 3 7 8 7z"/><path d="M12 10c0-3 2.5-6 8-6 0 4-3 6-8 6z"/><path d="M7 21h10"/></svg>
          <span style="font-size: 20px; font-weight: 800">mascote</span>
        </div>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{temCapaEbook}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; top: 150px; right: 64px; width: 210px; aspect-ratio: 9 / 16; z-index: 2">
      <img src="{{capaEbook}}" alt="Capa do ebook" style="display: block; width: 100%; height: 100%; object-fit: cover; box-sizing: border-box; border: 6px solid #F4ECDB; border-radius: 12px; box-shadow: 0 26px 50px rgba(0,0,0,0.55)">
    </div>
  </sc-if>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 52px 64px 52px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; align-items: center; gap: 14px; padding-bottom: 10px; border-bottom: 4px solid #F4ECDB; font-size: 24px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #F4ECDB">
        <span style="width: 18px; height: 18px; border-radius: 50%; background: #F4ECDB"></span>
        <span>{{tarja}}</span>
      </div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 900; line-height: 0.8; display: flex; align-items: baseline">
        <span style="font-size: 88px">{{contA}}</span><span style="font-size: 36px; color: #F4ECDB">{{contB}}</span>
      </div>
    </div>

    <h2 style="margin: 80px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 168px; line-height: 0.86; text-transform: uppercase">
      <span style="display: block">{{linha1}}</span>
      <span style="display: block; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 800; text-transform: none; font-size: 150px; line-height: 1; color: #E8A33D">{{destaque}}</span>
      <span style="display: block; color: transparent; -webkit-text-stroke: 3px #F4ECDB">{{linha2}}</span>
    </h2>
    <p style="margin: 26px 0 0; font-size: 40px; line-height: 1.42; font-weight: 500; max-width: 880px">{{texto}}</p>

    <div style="margin-top: auto; display: flex; flex-direction: column">
      <div style="display: flex; align-items: baseline; gap: 26px; padding: 16px 0; border-top: 2px solid rgba(244,236,219,0.5)">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 52px; color: #F4ECDB; width: 64px">01</span>
        <span style="font-size: 40px; font-weight: 700">{{ctaSalvar}}</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 26px; padding: 16px 0; border-top: 2px solid rgba(244,236,219,0.5)">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 52px; color: #F4ECDB; width: 64px">02</span>
        <span style="font-size: 40px; font-weight: 700">{{ctaSeguir}}</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 26px; padding: 16px 0; border-top: 2px solid rgba(244,236,219,0.5)">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 52px; color: #F4ECDB; width: 64px">03</span>
        <span style="font-size: 40px; font-weight: 700">{{ctaSite}}</span>
      </div>
    </div>

    <div style="margin-top: 10px; padding-top: 22px; border-top: 3px solid #F4ECDB; display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 700">
      <div>@canalterragentil</div>
      <div style="display: flex; align-items: center; gap: 6px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; font-size: 24px">
        <svg width="66" height="28" viewBox="0 0 66 28" fill="none" stroke="#F4ECDB" stroke-width="3.5" stroke-linecap="square" aria-hidden="true"><path d="M62 4L52 14l10 10M40 4L30 14l10 10M18 4L8 14l10 10"/></svg>
        <span style="margin-left: 8px">{{voltar}}</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tarja":{"editor":"text","default":"Para levar","section":"Texto"},"linha1":{"editor":"text","default":"Gentileza","section":"Texto"},"destaque":{"editor":"text","default":"gera","section":"Texto"},"linha2":{"editor":"text","default":"gentileza","section":"Texto"},"texto":{"editor":"text","default":"Cuide com calma e ela devolve em flores. Guarde este guia para a próxima poda.","section":"Texto"},"ctaSalvar":{"editor":"text","default":"Salve este post","section":"Texto"},"ctaSeguir":{"editor":"text","default":"Siga @canalterragentil","section":"Texto"},"ctaSite":{"editor":"text","default":"Visite terragentil.com.br","section":"Texto"},"voltar":{"editor":"text","default":"Rever do início","section":"Texto"},"contador":{"editor":"text","default":"08/08","section":"Texto"},"foto":{"editor":"text","default":"","section":"Foto"},"escurecimento":{"editor":"range","min":0,"max":90,"step":5,"default":55,"unit":"%","section":"Foto"},"zoom":{"editor":"range","min":1,"max":2.5,"step":0.05,"default":1.8,"section":"Foto"},"foco":{"editor":"enum","options":["center","top","bottom","left","right","top left","top right","bottom left","bottom right"],"default":"bottom left","section":"Foto"},"simularFotoClara":{"editor":"boolean","default":false,"section":"Foto"},"mostrarMascote":{"editor":"boolean","default":true,"section":"Mascote"},"mascote":{"editor":"text","default":"","section":"Mascote"},"capaEbook":{"editor":"text","default":"","section":"Mascote"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = (p.foto ?? '').trim();
    const m = (p.mascote ?? '').trim();
    const k = Math.max(0, Math.min(90, p.escurecimento ?? 55)) / 100;
    const z = p.zoom ?? 1.8;
    const foco = p.foco ?? 'bottom left';
    const D = 'radial-gradient(circle at 32% 34%, #7C9BDB 0 7%, rgba(124,155,219,0) 21%), radial-gradient(circle at 52% 26%, #9586D6 0 6%, rgba(149,134,214,0) 19%), radial-gradient(circle at 68% 46%, #6A8FD2 0 8%, rgba(106,143,210,0) 23%), radial-gradient(circle at 42% 56%, #A8BEEA 0 5%, rgba(168,190,234,0) 18%), radial-gradient(circle at 24% 58%, #8A9FE0 0 5%, rgba(138,159,224,0) 17%), radial-gradient(ellipse at 15% 85%, #3E6E3E 0 12%, rgba(62,110,62,0) 34%), radial-gradient(ellipse at 85% 80%, #2F5D33 0 14%, rgba(47,93,51,0) 36%), linear-gradient(165deg, #2E4F3A 0%, #182A20 100%)';
    const L = 'radial-gradient(circle at 32% 34%, #C9D6F5 0 7%, rgba(201,214,245,0) 21%), radial-gradient(circle at 52% 26%, #D8D0F3 0 6%, rgba(216,208,243,0) 19%), radial-gradient(circle at 68% 46%, #BFD0F1 0 8%, rgba(191,208,241,0) 23%), radial-gradient(circle at 42% 56%, #E6ECFA 0 5%, rgba(230,236,250,0) 18%), radial-gradient(circle at 24% 58%, #CBD5F3 0 5%, rgba(203,213,243,0) 17%), radial-gradient(ellipse at 15% 85%, #9CC08F 0 12%, rgba(156,192,143,0) 34%), radial-gradient(ellipse at 85% 80%, #8DB57F 0 14%, rgba(141,181,127,0) 36%), linear-gradient(165deg, #F3F4EC 0%, #CFDDC4 100%)';
    const T = {"tarja":"Para levar","linha1":"Gentileza","destaque":"gera","linha2":"gentileza","texto":"Cuide com calma e ela devolve em flores. Guarde este guia para a próxima poda.","ctaSalvar":"Salve este post","ctaSeguir":"Siga @canalterragentil","ctaSite":"Visite terragentil.com.br","voltar":"Rever do início","contador":"08/08"};
    const tx = {};
    Object.keys(T).forEach(function (c) { tx[c] = p[c] ?? T[c]; });
    const pc = String(tx.contador).split('/');
    tx.contA = pc[0];
    tx.contB = pc.length > 1 ? '/' + pc[1] : '';
    return Object.assign(tx, {foto: f, temFoto: !!f, semFoto: !f, mascote: m, temMascote: !!m, semMascote: !m, mostrarMascote: p.mostrarMascote ?? true, capaEbook: (p.capaEbook ?? '').trim(), temCapaEbook: !!(p.capaEbook ?? '').trim(), veu: 'rgba(11,20,16,' + k + ')', zoomTf: 'scale(' + z + ')', foco: foco, sim: p.simularFotoClara ? L : D });
  }
}
</script>
</body>
</html>
