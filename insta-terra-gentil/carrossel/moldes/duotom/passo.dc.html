<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>D5 Passo 1: Duotom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800;900&amp;family=Playfair+Display:ital,wght@1,700..900&amp;family=Work+Sans:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4ECDB}a:hover{color:#F4ECDB}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #0B1410; color: #F4ECDB; font-family: 'Work Sans', sans-serif">
  <div style="position: absolute; inset: 0; overflow: hidden">
    <sc-if value="{{temFoto}}" hint-placeholder-val="{{false}}">
      <img src="{{foto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{foco}}; transform: {{zoomTf}}; transform-origin: {{foco}}; filter: grayscale(1) contrast(1.15)">
    </sc-if>
    <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: {{sim}}; transform: {{zoomTf}}; transform-origin: {{foco}}; filter: grayscale(1) contrast(1.15)"></div>
    </sc-if>
    <div style="position: absolute; inset: 0; background: #E8A33D; mix-blend-mode: multiply"></div>
  </div>
  <div style="position: absolute; inset: 0; background: {{veu}}"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,20,16,0.92) 0%, rgba(11,20,16,0.8) 42%, rgba(11,20,16,0) 62%), linear-gradient(to bottom, rgba(11,20,16,0.6) 0%, rgba(11,20,16,0) 16%)"></div>

  <div aria-hidden="true" style="position: absolute; top: 120px; left: 50px; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 460px; line-height: 1; color: transparent; -webkit-text-stroke: 4px #F4ECDB">{{numero}}</div>

  <div style="position: absolute; top: 180px; right: 64px; width: 540px; box-sizing: border-box; background: #F4ECDB; color: #0B1410; padding: 30px 34px 32px">
    <div style="display: flex; align-items: center; gap: 18px">
      <div style="width: 92px; height: 92px; border-radius: 50%; border: 4px solid #0B1410; box-sizing: border-box; overflow: hidden; background: #F4ECDB; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{temAndre}}" hint-placeholder-val="{{false}}">
          <img src="{{fotoAndre}}" alt="André" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%">
        </sc-if>
        <sc-if value="{{semAndre}}" hint-placeholder-val="{{true}}">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1F4A2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Foto do André" role="img"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>
        </sc-if>
      </div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 46px; line-height: 1; text-transform: uppercase">Dica do André</div>
    </div>
    <p style="margin: 16px 0 0; font-size: 32px; line-height: 1.34; font-weight: 600">{{dica}}</p>
  </div>

  <sc-if value="{{mostrarMascote}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 380px; right: 616px; width: 120px; height: 120px; box-sizing: border-box; border: 4px solid #F4ECDB; background: #F4ECDB; overflow: hidden; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{temMascote}}" hint-placeholder-val="{{false}}">
        <img src="{{mascote}}" alt="Mascote Doutor Gentileza" style="width: 100%; height: 100%; object-fit: cover">
      </sc-if>
      <sc-if value="{{semMascote}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #1F4A2A">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4A8C4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 5 4 5c0 4 3 7 8 7z"/><path d="M12 10c0-3 2.5-6 8-6 0 4-3 6-8 6z"/><path d="M7 21h10"/></svg>
          <span style="font-size: 18px; font-weight: 800">mascote</span>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 52px 64px 52px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; align-items: center; gap: 14px; padding-bottom: 10px; border-bottom: 4px solid #F4ECDB; font-size: 24px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #F4ECDB">
        <span style="width: 18px; height: 18px; border-radius: 50%; background: #F4ECDB"></span>
        <span>{{tarja}}</span>
      </div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 900; line-height: 0.8; display: flex; align-items: baseline">
        <span style="font-size: 88px">{{contA}}</span><span style="font-size: 36px; color: #F4ECDB">{{contB}}</span>
      </div>
    </div>

    <h2 style="margin: auto 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 158px; line-height: 0.86; text-transform: uppercase">
      <span style="display: block">{{linha1}}</span>
      <span style="display: block; color: transparent; -webkit-text-stroke: 3px #F4ECDB">{{linha2}}</span>
      <span style="display: block; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 800; text-transform: none; font-size: 140px; line-height: 1.05; color: #E8A33D">{{destaque}}</span>
    </h2>
    <p style="margin: 26px 0 0; font-size: 40px; line-height: 1.42; font-weight: 500; max-width: 900px">{{texto}}</p>

    <div style="margin-top: 30px; padding-top: 22px; border-top: 3px solid #F4ECDB; display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 700">
      <div>@canalterragentil</div>
      <div style="display: flex; align-items: center; gap: 6px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; font-size: 24px">
        <span style="margin-right: 8px">Deslize</span>
        <svg width="66" height="28" viewBox="0 0 66 28" fill="none" stroke="#F4ECDB" stroke-width="3.5" stroke-linecap="square" aria-hidden="true"><path d="M4 4l10 10-10 10M26 4l10 10-10 10M48 4l10 10-10 10"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tarja":{"editor":"text","default":"Passo 1","section":"Texto"},"numero":{"editor":"text","default":"1","section":"Texto"},"linha1":{"editor":"text","default":"Corte logo","section":"Texto"},"linha2":{"editor":"text","default":"abaixo da","section":"Texto"},"destaque":{"editor":"text","default":"flor seca","section":"Texto"},"texto":{"editor":"text","default":"Ache o primeiro par de gemas gordinhas abaixo da flor. Corte uns 2 cm acima delas.","section":"Texto"},"dica":{"editor":"text","default":"Tesoura limpa e afiada faz corte reto. A planta cicatriza mais rápido.","section":"Texto"},"contador":{"editor":"text","default":"05/08","section":"Texto"},"foto":{"editor":"text","default":"","section":"Foto"},"fotoAndre":{"editor":"text","default":"","section":"Foto"},"escurecimento":{"editor":"range","min":0,"max":90,"step":5,"default":20,"unit":"%","section":"Foto"},"zoom":{"editor":"range","min":1,"max":2.5,"step":0.05,"default":1.3,"section":"Foto"},"foco":{"editor":"enum","options":["center","top","bottom","left","right","top left","top right","bottom left","bottom right"],"default":"left","section":"Foto"},"simularFotoClara":{"editor":"boolean","default":false,"section":"Foto"},"mostrarMascote":{"editor":"boolean","default":true,"section":"Mascote"},"mascote":{"editor":"text","default":"","section":"Mascote"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = (p.foto ?? '').trim();
    const a = (p.fotoAndre ?? '').trim();
    const m = (p.mascote ?? '').trim();
    const k = Math.max(0, Math.min(90, p.escurecimento ?? 20)) / 100;
    const z = p.zoom ?? 1.3;
    const foco = p.foco ?? 'left';
    const D = 'radial-gradient(circle at 32% 34%, #7C9BDB 0 7%, rgba(124,155,219,0) 21%), radial-gradient(circle at 52% 26%, #9586D6 0 6%, rgba(149,134,214,0) 19%), radial-gradient(circle at 68% 46%, #6A8FD2 0 8%, rgba(106,143,210,0) 23%), radial-gradient(circle at 42% 56%, #A8BEEA 0 5%, rgba(168,190,234,0) 18%), radial-gradient(circle at 24% 58%, #8A9FE0 0 5%, rgba(138,159,224,0) 17%), radial-gradient(ellipse at 15% 85%, #3E6E3E 0 12%, rgba(62,110,62,0) 34%), radial-gradient(ellipse at 85% 80%, #2F5D33 0 14%, rgba(47,93,51,0) 36%), linear-gradient(165deg, #2E4F3A 0%, #182A20 100%)';
    const L = 'radial-gradient(circle at 32% 34%, #C9D6F5 0 7%, rgba(201,214,245,0) 21%), radial-gradient(circle at 52% 26%, #D8D0F3 0 6%, rgba(216,208,243,0) 19%), radial-gradient(circle at 68% 46%, #BFD0F1 0 8%, rgba(191,208,241,0) 23%), radial-gradient(circle at 42% 56%, #E6ECFA 0 5%, rgba(230,236,250,0) 18%), radial-gradient(circle at 24% 58%, #CBD5F3 0 5%, rgba(203,213,243,0) 17%), radial-gradient(ellipse at 15% 85%, #9CC08F 0 12%, rgba(156,192,143,0) 34%), radial-gradient(ellipse at 85% 80%, #8DB57F 0 14%, rgba(141,181,127,0) 36%), linear-gradient(165deg, #F3F4EC 0%, #CFDDC4 100%)';
    const T = {"tarja":"Passo 1","numero":"1","linha1":"Corte logo","linha2":"abaixo da","destaque":"flor seca","texto":"Ache o primeiro par de gemas gordinhas abaixo da flor. Corte uns 2 cm acima delas.","dica":"Tesoura limpa e afiada faz corte reto. A planta cicatriza mais rápido.","contador":"05/08"};
    const tx = {};
    Object.keys(T).forEach(function (c) { tx[c] = p[c] ?? T[c]; });
    const pc = String(tx.contador).split('/');
    tx.contA = pc[0];
    tx.contB = pc.length > 1 ? '/' + pc[1] : '';
    return Object.assign(tx, {foto: f, temFoto: !!f, semFoto: !f, fotoAndre: a, temAndre: !!a, semAndre: !a, mascote: m, temMascote: !!m, semMascote: !m, mostrarMascote: p.mostrarMascote ?? true, veu: 'rgba(11,20,16,' + k + ')', zoomTf: 'scale(' + z + ')', foco: foco, sim: p.simularFotoClara ? L : D });
  }
}
</script>
</body>
</html>
