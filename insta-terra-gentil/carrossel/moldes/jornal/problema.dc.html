<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>E2 O problema: Jornal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Source+Serif+4:opsz,wght@8..60,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1410}a:hover{color:#1F4A2A}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #2A2620; color: #0B1410; font-family: 'Source Serif 4', serif">
  <div style="position: absolute; inset: 0; overflow: hidden">
    <sc-if value="{{temFoto}}" hint-placeholder-val="{{false}}">
      <img src="{{foto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{foco}}; transform: {{zoomTf}}; transform-origin: {{foco}}; filter: sepia(0.3) saturate(0.85) contrast(1.05)">
    </sc-if>
    <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: {{sim}}; transform: {{zoomTf}}; transform-origin: {{foco}}; filter: sepia(0.3) saturate(0.85) contrast(1.05)"></div>
    </sc-if>
    <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(11,20,16,0.55) 1.2px, rgba(11,20,16,0) 1.9px); background-size: 7px 7px; opacity: 0.35"></div>
  </div>
  <div style="position: absolute; inset: 0; background: {{veu}}"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(11,20,16,0.45) 0%, rgba(11,20,16,0) 14%)"></div>

  <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 190px; left: 64px; border: 2px dashed rgba(244,236,219,0.8); padding: 12px 20px; font-size: 24px; font-weight: 600; color: #F4ECDB; background: rgba(11,20,16,0.55)">Foto: {{legendaFoto}}</div>
  </sc-if>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 52px 64px 0; display: flex; justify-content: space-between; align-items: flex-start">
    <div style="background: #0B1410; color: #F4ECDB; padding: 12px 22px; font-family: 'Alfa Slab One', serif; font-size: 26px; letter-spacing: 0.1em; text-transform: uppercase">{{tarja}}</div>
    <div style="width: 100px; height: 100px; border-radius: 50%; background: #F4ECDB; border: 3px solid #0B1410; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Alfa Slab One', serif; font-size: 30px">{{contador}}</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 800px; filter: drop-shadow(0 -8px 18px rgba(0,0,0,0.35))">
    <div style="position: absolute; inset: 0; background: #F4ECDB; clip-path: polygon(0 18px, 4% 6px, 8% 16px, 12% 4px, 16% 14px, 20% 2px, 24% 12px, 28% 6px, 32% 18px, 36% 4px, 40% 12px, 44% 2px, 48% 14px, 52% 6px, 56% 16px, 60% 4px, 64% 12px, 68% 0, 72% 14px, 76% 6px, 80% 16px, 84% 4px, 88% 12px, 92% 2px, 96% 14px, 100% 6px, 100% 100%, 0 100%); box-sizing: border-box; padding: 64px 64px 50px; display: flex; flex-direction: column">
      <h2 style="margin: 0; font-family: 'Alfa Slab One', serif; font-weight: 400; font-size: 92px; line-height: 1.0; text-transform: uppercase">
        <span style="display: block">{{linha1}}</span>
        <span style="display: block; color: transparent; -webkit-text-stroke: 2.5px #0B1410">{{linha2}}</span>
        <span style="display: block; font-family: 'Libre Caslon Text', serif; font-style: italic; text-transform: none; font-size: 118px; line-height: 1.05; color: #8A5410">{{destaque}}</span>
      </h2>
      <div style="margin-top: 26px; height: 2px; background: #0B1410"></div>
      <p style="margin: 22px 0 0; font-size: 40px; line-height: 1.45; font-weight: 500; color: #24302A">{{texto}}</p>
      <div style="margin-top: 18px; font-family: 'Libre Caslon Text', serif; font-style: italic; font-size: 48px; color: #8A5410">{{nota}}</div>
      <div style="margin-top: auto; padding-top: 18px; border-top: 5px double #0B1410; display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 700">
        <div>@canalterragentil</div>
        <div style="display: flex; align-items: center; gap: 12px; font-style: italic">
          <span>Deslize</span>
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>
  </div>

  <sc-if value="{{mostrarMascote}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; right: 70px; bottom: 700px; width: 150px; height: 170px; box-sizing: border-box; padding: 10px; background: #F4ECDB; border: 3px dashed #0B1410; transform: rotate(-5deg); box-shadow: 0 10px 22px rgba(0,0,0,0.3)">
      <div style="width: 100%; height: 100%; border: 2px solid #0B1410; box-sizing: border-box; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #EADFC6">
        <sc-if value="{{temMascote}}" hint-placeholder-val="{{false}}">
          <img src="{{mascote}}" alt="Mascote Doutor Gentileza" style="width: 100%; height: 100%; object-fit: cover; filter: sepia(0.2)">
        </sc-if>
        <sc-if value="{{semMascote}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #1F4A2A">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#1F4A2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 5 4 5c0 4 3 7 8 7z"/><path d="M12 10c0-3 2.5-6 8-6 0 4-3 6-8 6z"/><path d="M7 21h10"/></svg>
            <span style="font-size: 20px; font-weight: 700">mascote</span>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tarja":{"editor":"text","default":"O problema","section":"Texto"},"linha1":{"editor":"text","default":"Podou e ela","section":"Texto"},"linha2":{"editor":"text","default":"não","section":"Texto"},"destaque":{"editor":"text","default":"floresceu?","section":"Texto"},"texto":{"editor":"text","default":"A hortênsia forma os botões do ano que vem nos galhos de agora. Cortou na hora errada, levou as flores junto.","section":"Texto"},"nota":{"editor":"text","default":"Calma, não é culpa sua.","section":"Texto"},"contador":{"editor":"text","default":"2/8","section":"Texto"},"legendaFoto":{"editor":"text","default":"galhos só com folhas","section":"Texto"},"foto":{"editor":"text","default":"","section":"Foto"},"escurecimento":{"editor":"range","min":0,"max":90,"step":5,"default":20,"unit":"%","section":"Foto"},"zoom":{"editor":"range","min":1,"max":2.5,"step":0.05,"default":1.5,"section":"Foto"},"foco":{"editor":"enum","options":["center","top","bottom","left","right","top left","top right","bottom left","bottom right"],"default":"top left","section":"Foto"},"simularFotoClara":{"editor":"boolean","default":false,"section":"Foto"},"mostrarMascote":{"editor":"boolean","default":false,"section":"Mascote"},"mascote":{"editor":"text","default":"","section":"Mascote"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = (p.foto ?? '').trim();
    const m = (p.mascote ?? '').trim();
    const k = Math.max(0, Math.min(90, p.escurecimento ?? 20)) / 100;
    const z = p.zoom ?? 1.5;
    const foco = p.foco ?? 'top left';
    const D = 'radial-gradient(circle at 32% 34%, #7C9BDB 0 7%, rgba(124,155,219,0) 21%), radial-gradient(circle at 52% 26%, #9586D6 0 6%, rgba(149,134,214,0) 19%), radial-gradient(circle at 68% 46%, #6A8FD2 0 8%, rgba(106,143,210,0) 23%), radial-gradient(circle at 42% 56%, #A8BEEA 0 5%, rgba(168,190,234,0) 18%), radial-gradient(circle at 24% 58%, #8A9FE0 0 5%, rgba(138,159,224,0) 17%), radial-gradient(ellipse at 15% 85%, #3E6E3E 0 12%, rgba(62,110,62,0) 34%), radial-gradient(ellipse at 85% 80%, #2F5D33 0 14%, rgba(47,93,51,0) 36%), linear-gradient(165deg, #2E4F3A 0%, #182A20 100%)';
    const L = 'radial-gradient(circle at 32% 34%, #C9D6F5 0 7%, rgba(201,214,245,0) 21%), radial-gradient(circle at 52% 26%, #D8D0F3 0 6%, rgba(216,208,243,0) 19%), radial-gradient(circle at 68% 46%, #BFD0F1 0 8%, rgba(191,208,241,0) 23%), radial-gradient(circle at 42% 56%, #E6ECFA 0 5%, rgba(230,236,250,0) 18%), radial-gradient(circle at 24% 58%, #CBD5F3 0 5%, rgba(203,213,243,0) 17%), radial-gradient(ellipse at 15% 85%, #9CC08F 0 12%, rgba(156,192,143,0) 34%), radial-gradient(ellipse at 85% 80%, #8DB57F 0 14%, rgba(141,181,127,0) 36%), linear-gradient(165deg, #F3F4EC 0%, #CFDDC4 100%)';
    const T = {"tarja":"O problema","linha1":"Podou e ela","linha2":"não","destaque":"floresceu?","texto":"A hortênsia forma os botões do ano que vem nos galhos de agora. Cortou na hora errada, levou as flores junto.","nota":"Calma, não é culpa sua.","contador":"2/8","legendaFoto":"galhos só com folhas"};
    const tx = {};
    Object.keys(T).forEach(function (c) { tx[c] = p[c] ?? T[c]; });
    return Object.assign(tx, {foto: f, temFoto: !!f, semFoto: !f, mascote: m, temMascote: !!m, semMascote: !m, mostrarMascote: p.mostrarMascote ?? false, veu: 'rgba(11,20,16,' + k + ')', zoomTf: 'scale(' + z + ')', foco: foco, sim: p.simularFotoClara ? L : D });
  }
}
</script>
</body>
</html>
