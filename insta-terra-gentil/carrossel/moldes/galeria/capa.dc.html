<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>F1 Capa: Galeria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Jost:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4ECDB}a:hover{color:#1F4A2A}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #E8A33D; color: #0B1410; font-family: 'Jost', sans-serif">
  <div style="position: absolute; inset: 0; overflow: hidden">
    <sc-if value="{{temFoto}}" hint-placeholder-val="{{false}}">
      <img src="{{foto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{foco}}; transform: {{zoomTf}}; transform-origin: {{foco}}">
    </sc-if>
    <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: {{sim}}; transform: {{zoomTf}}; transform-origin: {{foco}}"></div>
    </sc-if>
  </div>
  <div style="position: absolute; inset: 0; background: {{veu}}"></div>
  <div style="position: absolute; left: 48px; top: 140px; width: 984px; height: 740px; box-shadow: 0 0 0 1600px #E8A33D; outline: 2px solid #1F4A2A; outline-offset: -16px"></div>

  <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 190px; left: 50%; transform: translateX(-50%); white-space: nowrap; border: 2px dashed rgba(244,236,219,0.8); padding: 12px 20px; font-size: 22px; font-weight: 500; background: rgba(11,20,16,0.55); color: #F4ECDB">Foto: {{legendaFoto}}</div>
  </sc-if>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 44px 64px 48px; display: flex; flex-direction: column; align-items: center; text-align: center">
    <div style="width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 24px">
      <div style="justify-self: start; font-family: 'Bodoni Moda', serif; font-size: 30px; font-weight: 700">Terra <em style="font-weight: 400">Gentil</em></div>
      <div style="display: flex; align-items: center; gap: 16px; font-size: 22px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: #1F4A2A">
        <span style="width: 40px; height: 1px; background: #1F4A2A"></span>
        <span>{{tarja}}</span>
        <span style="width: 40px; height: 1px; background: #1F4A2A"></span>
      </div>
      <div style="justify-self: end; font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 34px">{{contador}}</div>
    </div>

    <h1 style="margin: 840px 0 0; font-family: 'Bodoni Moda', serif; font-weight: 900; font-size: 66px; line-height: 1.0; text-transform: uppercase; letter-spacing: 0.01em; font-variation-settings: 'opsz' 96">
      <span style="display: block">{{linha1}} {{linha2}}</span>
      <span style="display: block; color: transparent; -webkit-text-stroke: 1.8px #0B1410">{{linha3}}</span>
      <span style="display: block; font-style: italic; font-weight: 600; text-transform: none; font-size: 112px; line-height: 0.95; letter-spacing: -0.01em; color: #1F4A2A">{{destaque}}</span>
    </h1>

    <div style="margin-top: auto; width: 100%; padding-top: 18px; border-top: 1px solid rgba(11,20,16,0.4); display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 500">
      <div>@canalterragentil</div>
      <div style="display: flex; align-items: center; gap: 14px; font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 30px; color: #1F4A2A">
        <span>Deslize</span>
        <svg width="70" height="20" viewBox="0 0 70 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10h64M58 3l8 7-8 7"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tarja":{"editor":"text","default":"Jardinagem · Poda","section":"Texto"},"linha1":{"editor":"text","default":"Como podar","section":"Texto"},"linha2":{"editor":"text","default":"hortênsia","section":"Texto"},"linha3":{"editor":"text","default":"sem perder as","section":"Texto"},"destaque":{"editor":"text","default":"flores","section":"Texto"},"contador":{"editor":"text","default":"1/8","section":"Texto"},"legendaFoto":{"editor":"text","default":"hortênsia azul em flor, natural, sem filtro","section":"Texto"},"foto":{"editor":"text","default":"","section":"Foto"},"escurecimento":{"editor":"range","min":0,"max":90,"step":5,"default":0,"unit":"%","section":"Foto"},"zoom":{"editor":"range","min":1,"max":2.5,"step":0.05,"default":1,"section":"Foto"},"foco":{"editor":"enum","options":["center","top","bottom","left","right","top left","top right","bottom left","bottom right"],"default":"top","section":"Foto"},"simularFotoClara":{"editor":"boolean","default":false,"section":"Foto"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = (p.foto ?? '').trim();
    const k = Math.max(0, Math.min(90, p.escurecimento ?? 0)) / 100;
    const z = p.zoom ?? 1;
    const foco = p.foco ?? 'top';
    const D = 'radial-gradient(circle at 32% 34%, #7C9BDB 0 7%, rgba(124,155,219,0) 21%), radial-gradient(circle at 52% 26%, #9586D6 0 6%, rgba(149,134,214,0) 19%), radial-gradient(circle at 68% 46%, #6A8FD2 0 8%, rgba(106,143,210,0) 23%), radial-gradient(circle at 42% 56%, #A8BEEA 0 5%, rgba(168,190,234,0) 18%), radial-gradient(circle at 24% 58%, #8A9FE0 0 5%, rgba(138,159,224,0) 17%), radial-gradient(ellipse at 15% 85%, #3E6E3E 0 12%, rgba(62,110,62,0) 34%), radial-gradient(ellipse at 85% 80%, #2F5D33 0 14%, rgba(47,93,51,0) 36%), linear-gradient(165deg, #2E4F3A 0%, #182A20 100%)';
    const L = 'radial-gradient(circle at 32% 34%, #C9D6F5 0 7%, rgba(201,214,245,0) 21%), radial-gradient(circle at 52% 26%, #D8D0F3 0 6%, rgba(216,208,243,0) 19%), radial-gradient(circle at 68% 46%, #BFD0F1 0 8%, rgba(191,208,241,0) 23%), radial-gradient(circle at 42% 56%, #E6ECFA 0 5%, rgba(230,236,250,0) 18%), radial-gradient(circle at 24% 58%, #CBD5F3 0 5%, rgba(203,213,243,0) 17%), radial-gradient(ellipse at 15% 85%, #9CC08F 0 12%, rgba(156,192,143,0) 34%), radial-gradient(ellipse at 85% 80%, #8DB57F 0 14%, rgba(141,181,127,0) 36%), linear-gradient(165deg, #F3F4EC 0%, #CFDDC4 100%)';
    const T = {"tarja":"Jardinagem · Poda","linha1":"Como podar","linha2":"hortênsia","linha3":"sem perder as","destaque":"flores","contador":"1/8","legendaFoto":"hortênsia azul em flor, natural, sem filtro"};
    const tx = {};
    Object.keys(T).forEach(function (c) { tx[c] = p[c] ?? T[c]; });
    return Object.assign(tx, {foto: f, temFoto: !!f, semFoto: !f, veu: 'rgba(11,20,16,' + k + ')', zoomTf: 'scale(' + z + ')', foco: foco, sim: p.simularFotoClara ? L : D });
  }
}
</script>
</body>
</html>
