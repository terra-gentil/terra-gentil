<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>B5 Passo 1: Faixas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&amp;family=DM+Serif+Display:ital@0;1&amp;family=Caveat:wght@500..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4ECDB}a:hover{color:#E8A33D}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #1A2E22; color: #F4ECDB; font-family: 'Archivo', sans-serif">
  <div style="position: absolute; inset: 0; overflow: hidden">
    <sc-if value="{{temFoto}}" hint-placeholder-val="{{false}}">
      <img src="{{foto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{foco}}; transform: {{zoomTf}}; transform-origin: {{foco}}">
    </sc-if>
    <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: {{sim}}; transform: {{zoomTf}}; transform-origin: {{foco}}"></div>
    </sc-if>
  </div>
  <div style="position: absolute; inset: 0; background: {{veu}}"></div>

  <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 170px; left: 56px; display: flex; align-items: center; gap: 12px; background: rgba(11,20,16,0.7); border: 2px dashed rgba(244,236,219,0.6); padding: 12px 20px; font-size: 22px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/></svg>
      <span>Foto: {{legendaFoto}}</span>
    </div>
  </sc-if>

  <div style="position: absolute; top: 172px; right: 60px; width: 420px; transform: rotate(3deg)">
    <div aria-hidden="true" style="position: absolute; top: -20px; left: 135px; width: 150px; height: 42px; background: rgba(232,163,61,0.85); transform: rotate(-5deg)"></div>
    <div style="background: #FBF8F1; padding: 20px 20px 26px; box-shadow: 0 24px 50px rgba(0,0,0,0.4); color: #1F2A22">
      <div style="width: 380px; height: 140px; background: #CFC6AE; overflow: hidden">
        <sc-if value="{{temAndre}}" hint-placeholder-val="{{false}}">
          <img src="{{fotoAndre}}" alt="André" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block">
        </sc-if>
        <sc-if value="{{semAndre}}" hint-placeholder-val="{{true}}">
          <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; color: #5C5236; font-size: 22px; font-weight: 700">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>
            <span>Foto do André</span>
          </div>
        </sc-if>
      </div>
      <div style="margin-top: 14px; font-family: 'Caveat', cursive; font-size: 48px; font-weight: 700; color: #8A5410; line-height: 1">Dica do André</div>
      <p style="margin: 8px 0 0; font-size: 29px; line-height: 1.32; font-weight: 600">{{dica}}</p>
    </div>
  </div>

  <sc-if value="{{mostrarMascote}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 430px; right: 486px; width: 120px; height: 120px; background: #F4ECDB; border: 4px solid #0B1410; box-sizing: border-box; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: rotate(-4deg)">
      <sc-if value="{{temMascote}}" hint-placeholder-val="{{false}}">
        <img src="{{mascote}}" alt="Mascote Doutor Gentileza" style="width: 100%; height: 100%; object-fit: cover">
      </sc-if>
      <sc-if value="{{semMascote}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #1F4A2A">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1F4A2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 5 4 5c0 4 3 7 8 7z"/><path d="M12 10c0-3 2.5-6 8-6 0 4-3 6-8 6z"/><path d="M7 21h10"/></svg>
          <span style="font-size: 17px; font-weight: 900">mascote</span>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <div style="position: relative; height: 100%; display: flex; flex-direction: column">
    <div style="padding: 52px 56px 0; display: flex; justify-content: space-between; align-items: flex-start">
      <div style="background: #F4ECDB; color: #0B1410; padding: 12px 20px; font-size: 26px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase">Terra Gentil</div>
      <div style="background: #E8A33D; color: #0B1410; width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900">{{contador}}</div>
    </div>

    <div style="margin-top: auto; padding: 0 56px 40px; display: flex; flex-direction: column; align-items: flex-start">
      <div style="background: #1F4A2A; color: #F4ECDB; padding: 10px 18px; margin-bottom: 14px; font-size: 24px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase">{{tarja}}</div>
      <div style="background: #F4ECDB; color: #0B1410; padding: 6px 22px 10px; font-size: 112px; line-height: 1; font-weight: 900; font-variation-settings: 'wdth' 70; text-transform: uppercase; letter-spacing: -0.01em">{{linha1}}</div>
      <div style="background: #F4ECDB; color: #0B1410; padding: 6px 22px 10px; font-size: 112px; line-height: 1; font-weight: 900; font-variation-settings: 'wdth' 70; text-transform: uppercase; letter-spacing: 0.01em; color: transparent; -webkit-text-stroke: 2.5px #0B1410">{{linha2}}</div>
      <div style="background: #1F4A2A; padding: 0 26px 18px 22px; font-family: 'DM Serif Display', serif; font-style: italic; font-size: 140px; line-height: 1; color: #E8A33D">{{destaque}}</div>
      <p style="margin: 36px 0 0; max-width: 920px; font-size: 38px; line-height: 1.62; font-weight: 600; color: #0B1410"><span style="background: #0B1410; color: #F4ECDB; padding: 4px 14px; box-decoration-break: clone; -webkit-box-decoration-break: clone">{{texto}}</span></p>
    </div>

    <div style="background: #F4ECDB; color: #0B1410; height: 104px; padding: 0 56px; display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 800">
      <div>@canalterragentil</div>
      <div style="display: flex; align-items: center; gap: 14px; letter-spacing: 0.16em; text-transform: uppercase; font-size: 24px; color: #1F4A2A">
        <span>Deslize</span>
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tarja":{"editor":"text","default":"Passo 1","section":"Texto"},"linha1":{"editor":"text","default":"Corte logo","section":"Texto"},"linha2":{"editor":"text","default":"abaixo da","section":"Texto"},"destaque":{"editor":"text","default":"flor seca","section":"Texto"},"texto":{"editor":"text","default":"Ache o primeiro par de gemas gordinhas abaixo da flor. Corte uns 2 cm acima delas.","section":"Texto"},"dica":{"editor":"text","default":"Tesoura limpa e afiada faz corte reto. A planta cicatriza mais rápido.","section":"Texto"},"contador":{"editor":"text","default":"5/8","section":"Texto"},"legendaFoto":{"editor":"text","default":"mãos com tesoura junto à flor seca","section":"Texto"},"foto":{"editor":"text","default":"","section":"Foto"},"fotoAndre":{"editor":"text","default":"","section":"Foto"},"escurecimento":{"editor":"range","min":0,"max":90,"step":5,"default":15,"unit":"%","section":"Foto"},"zoom":{"editor":"range","min":1,"max":2.5,"step":0.05,"default":1.25,"section":"Foto"},"foco":{"editor":"enum","options":["center","top","bottom","left","right","top left","top right","bottom left","bottom right"],"default":"right","section":"Foto"},"simularFotoClara":{"editor":"boolean","default":false,"section":"Foto"},"mostrarMascote":{"editor":"boolean","default":true,"section":"Mascote"},"mascote":{"editor":"text","default":"","section":"Mascote"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = (p.foto ?? '').trim();
    const m = (p.mascote ?? '').trim();
    const a = (p.fotoAndre ?? '').trim();
    const k = Math.max(0, Math.min(90, p.escurecimento ?? 15)) / 100;
    const z = p.zoom ?? 1.25;
    const foco = p.foco ?? 'right';
    const D = 'radial-gradient(circle at 32% 34%, #7C9BDB 0 7%, rgba(124,155,219,0) 21%), radial-gradient(circle at 52% 26%, #9586D6 0 6%, rgba(149,134,214,0) 19%), radial-gradient(circle at 68% 46%, #6A8FD2 0 8%, rgba(106,143,210,0) 23%), radial-gradient(circle at 42% 56%, #A8BEEA 0 5%, rgba(168,190,234,0) 18%), radial-gradient(circle at 24% 58%, #8A9FE0 0 5%, rgba(138,159,224,0) 17%), radial-gradient(ellipse at 15% 85%, #3E6E3E 0 12%, rgba(62,110,62,0) 34%), radial-gradient(ellipse at 85% 80%, #2F5D33 0 14%, rgba(47,93,51,0) 36%), linear-gradient(165deg, #2E4F3A 0%, #182A20 100%)';
    const L = 'radial-gradient(circle at 32% 34%, #C9D6F5 0 7%, rgba(201,214,245,0) 21%), radial-gradient(circle at 52% 26%, #D8D0F3 0 6%, rgba(216,208,243,0) 19%), radial-gradient(circle at 68% 46%, #BFD0F1 0 8%, rgba(191,208,241,0) 23%), radial-gradient(circle at 42% 56%, #E6ECFA 0 5%, rgba(230,236,250,0) 18%), radial-gradient(circle at 24% 58%, #CBD5F3 0 5%, rgba(203,213,243,0) 17%), radial-gradient(ellipse at 15% 85%, #9CC08F 0 12%, rgba(156,192,143,0) 34%), radial-gradient(ellipse at 85% 80%, #8DB57F 0 14%, rgba(141,181,127,0) 36%), linear-gradient(165deg, #F3F4EC 0%, #CFDDC4 100%)';
    const T = {"tarja":"Passo 1","linha1":"Corte logo","linha2":"abaixo da","destaque":"flor seca","texto":"Ache o primeiro par de gemas gordinhas abaixo da flor. Corte uns 2 cm acima delas.","dica":"Tesoura limpa e afiada faz corte reto. A planta cicatriza mais rápido.","contador":"5/8","legendaFoto":"mãos com tesoura junto à flor seca"};
    const tx = {};
    Object.keys(T).forEach(function (c) { tx[c] = p[c] ?? T[c]; });
    return Object.assign(tx, {mascote: m, temMascote: !!m, semMascote: !m, mostrarMascote: p.mostrarMascote ?? true, foto: f, temFoto: !!f, semFoto: !f, fotoAndre: a, temAndre: !!a, semAndre: !a, veu: 'rgba(11,20,16,' + k + ')', zoomTf: 'scale(' + z + ')', foco: foco, sim: p.simularFotoClara ? L : D });
  }
}
</script>
</body>
</html>
