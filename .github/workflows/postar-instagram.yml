name: Postar Instagram

# Posta no Instagram o carrossel do dia, a partir do pacote que a prévia deixou na branch ig-slides.
# BOTAO: variavel do repositorio IG_PUBLICAR (Settings > Secrets and variables > Actions > Variables).
#   "ligado"  = posta de verdade.  Qualquer outra coisa (ou ausente) = so confere e NAO posta.
# Quem dispara e o TriggerAll (cron do horario de postar), cadastrado com este nome de workflow.
on:
  workflow_dispatch:
    inputs:
      dia:
        description: 'Dia do post (AAAA-MM-DD). Vazio = hoje em Brasilia'
        required: false
        type: string
      so_token:
        description: 'So valida o token e a conta, nao posta (precisa do botao ligado)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Mesmo grupo da rotina: nunca postar enquanto a previa ou o merge estao rodando.
concurrency:
  group: insta-rotina
  cancel-in-progress: false

jobs:
  postar:
    name: Conferir e postar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dia
        id: dia
        env:
          DIA_ENTRADA: ${{ inputs.dia }}
        run: |
          DIA="${DIA_ENTRADA:-$(TZ=America/Sao_Paulo date +%F)}"
          if ! echo "$DIA" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "dia invalido: $DIA"; exit 1
          fi
          echo "dia=$DIA" >> "$GITHUB_OUTPUT"

      # Imagens, legenda e ficha que a previa guardou. Sem a branch, a previa ainda nao rodou.
      - name: Pacote do dia (branch ig-slides)
        uses: actions/checkout@v4
        with:
          ref: ig-slides
          path: ig

      - name: Postar (ou so conferir, se o botao estiver desligado)
        id: postar
        env:
          IG_PUBLICAR: ${{ vars.IG_PUBLICAR }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SO_TOKEN: ${{ inputs.so_token }}
        run: |
          EXTRA=""
          if [ "$SO_TOKEN" = "true" ]; then EXTRA="--so-token"; fi
          node insta-terra-gentil/publicar/instagram/publicar-cli.mjs \
            --dia "${{ steps.dia.outputs.dia }}" --pasta "ig/${{ steps.dia.outputs.dia }}" $EXTRA

      # O registro impede postar o mesmo dia duas vezes (mesmo se o TriggerAll disparar de novo).
      - name: Registrar o que foi postado
        if: steps.postar.outputs.acao == 'publicado' || steps.postar.outputs.acao == 'recuperado'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insta-terra-gentil/dados/publicados
          git commit -m "insta: registra o post de ${{ steps.dia.outputs.dia }} no Instagram"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
