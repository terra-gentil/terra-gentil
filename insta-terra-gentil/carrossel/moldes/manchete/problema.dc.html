<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>A2 O problema: Manchete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400..800&amp;family=Caveat:wght@500..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4ECDB}a:hover{color:#E8A33D}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #1A2E22; color: #F4ECDB; font-family: 'Manrope', sans-serif">
  <div style="position: absolute; inset: 0; overflow: hidden">
    <sc-if value="{{temFoto}}" hint-placeholder-val="{{false}}">
      <img src="{{foto}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{foco}}; transform: {{zoomTf}}; transform-origin: {{foco}}">
    </sc-if>
    <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: {{sim}}; transform: {{zoomTf}}; transform-origin: {{foco}}"></div>
    </sc-if>
  </div>
  <div style="position: absolute; inset: 0; background: {{veu}}"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,20,16,0.9) 0%, rgba(11,20,16,0.8) 52%, rgba(11,20,16,0.35) 72%, rgba(11,20,16,0) 86%), linear-gradient(to bottom, rgba(11,20,16,0.55) 0%, rgba(11,20,16,0) 15%)"></div>

  <sc-if value="{{semFoto}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; top: 150px; left: 64px; display: flex; align-items: center; gap: 12px; background: rgba(11,20,16,0.7); border: 2px dashed rgba(244,236,219,0.6); border-radius: 8px; padding: 12px 20px; font-size: 22px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/></svg>
      <span>Foto: {{legendaFoto}}</span>
    </div>
  </sc-if>

  <sc-if value="{{mostrarMascote}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; right: 64px; bottom: 170px; width: 140px; height: 140px; border-radius: 50%; background: #F4ECDB; border: 4px solid #E8A33D; box-sizing: border-box; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px rgba(0,0,0,0.35); transform: rotate(6deg)">
      <sc-if value="{{temMascote}}" hint-placeholder-val="{{false}}">
        <img src="{{mascote}}" alt="Mascote Doutor Gentileza" style="width: 100%; height: 100%; object-fit: cover">
      </sc-if>
      <sc-if value="{{semMascote}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #1F4A2A">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#4A8C4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 5 4 5c0 4 3 7 8 7z"/><path d="M12 10c0-3 2.5-6 8-6 0 4-3 6-8 6z"/><path d="M7 21h10"/></svg>
          <span style="font-size: 18px; font-weight: 800">mascote</span>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 56px 64px 52px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="background: #E8A33D; color: #0B1410; padding: 12px 20px; font-size: 24px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase">{{tarja}}</div>
      <div style="background: rgba(11,20,16,0.78); padding: 10px 20px; border-radius: 999px; font-size: 26px; font-weight: 800">{{contador}}</div>
    </div>

    <h2 style="margin: auto 0 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 128px; line-height: 0.92; text-transform: uppercase; text-shadow: 0 2px 28px rgba(0,0,0,0.45)">
      <span style="display: block">{{linha1}}</span>
      <span style="display: block; color: transparent; -webkit-text-stroke: 3px #F4ECDB; text-shadow: none">{{linha2}}</span>
      <span style="display: block; font-family: 'Instrument Serif', serif; font-style: italic; text-transform: none; font-size: 172px; line-height: 0.84; color: #E8A33D">{{destaque}}</span>
    </h2>
    <p style="margin: 36px 0 0; font-size: 40px; line-height: 1.42; font-weight: 500; max-width: 900px; text-shadow: 0 1px 14px rgba(0,0,0,0.5)">{{texto}}</p>
    <div style="margin-top: 22px; font-family: 'Caveat', cursive; font-size: 60px; font-weight: 700; color: #E8A33D; text-shadow: 0 1px 14px rgba(0,0,0,0.5)">{{nota}}</div>

    <div style="margin-top: 36px; padding-top: 24px; border-top: 2px solid rgba(244,236,219,0.4); display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 800">
      <div>@canalterragentil</div>
      <div style="display: flex; align-items: center; gap: 14px; letter-spacing: 0.16em; text-transform: uppercase; font-size: 24px; color: #E8A33D">
        <span>Deslize</span>
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tarja":{"editor":"text","default":"O problema","section":"Texto"},"linha1":{"editor":"text","default":"Podou e ela","section":"Texto"},"linha2":{"editor":"text","default":"não","section":"Texto"},"destaque":{"editor":"text","default":"floresceu?","section":"Texto"},"texto":{"editor":"text","default":"A hortênsia forma os botões do ano que vem nos galhos de agora. Cortou na hora errada, levou as flores junto.","section":"Texto"},"nota":{"editor":"text","default":"Calma, não é culpa sua.","section":"Texto"},"contador":{"editor":"text","default":"2/8","section":"Texto"},"legendaFoto":{"editor":"text","default":"galhos de hortênsia só com folhas, recorte fechado","section":"Texto"},"foto":{"editor":"text","default":"","section":"Foto"},"escurecimento":{"editor":"range","min":0,"max":90,"step":5,"default":45,"unit":"%","section":"Foto"},"zoom":{"editor":"range","min":1,"max":2.5,"step":0.05,"default":1.6,"section":"Foto"},"foco":{"editor":"enum","options":["center","top","bottom","left","right","top left","top right","bottom left","bottom right"],"default":"top right","section":"Foto"},"simularFotoClara":{"editor":"boolean","default":false,"section":"Foto"},"mostrarMascote":{"editor":"boolean","default":false,"section":"Mascote"},"mascote":{"editor":"text","default":"","section":"Mascote"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = (p.foto ?? '').trim();
    const m = (p.mascote ?? '').trim();
    const k = Math.max(0, Math.min(90, p.escurecimento ?? 45)) / 100;
    const z = p.zoom ?? 1.6;
    const foco = p.foco ?? 'top right';
    const D = 'radial-gradient(circle at 32% 34%, #7C9BDB 0 7%, rgba(124,155,219,0) 21%), radial-gradient(circle at 52% 26%, #9586D6 0 6%, rgba(149,134,214,0) 19%), radial-gradient(circle at 68% 46%, #6A8FD2 0 8%, rgba(106,143,210,0) 23%), radial-gradient(circle at 42% 56%, #A8BEEA 0 5%, rgba(168,190,234,0) 18%), radial-gradient(circle at 24% 58%, #8A9FE0 0 5%, rgba(138,159,224,0) 17%), radial-gradient(ellipse at 15% 85%, #3E6E3E 0 12%, rgba(62,110,62,0) 34%), radial-gradient(ellipse at 85% 80%, #2F5D33 0 14%, rgba(47,93,51,0) 36%), linear-gradient(165deg, #2E4F3A 0%, #182A20 100%)';
    const L = 'radial-gradient(circle at 32% 34%, #C9D6F5 0 7%, rgba(201,214,245,0) 21%), radial-gradient(circle at 52% 26%, #D8D0F3 0 6%, rgba(216,208,243,0) 19%), radial-gradient(circle at 68% 46%, #BFD0F1 0 8%, rgba(191,208,241,0) 23%), radial-gradient(circle at 42% 56%, #E6ECFA 0 5%, rgba(230,236,250,0) 18%), radial-gradient(circle at 24% 58%, #CBD5F3 0 5%, rgba(203,213,243,0) 17%), radial-gradient(ellipse at 15% 85%, #9CC08F 0 12%, rgba(156,192,143,0) 34%), radial-gradient(ellipse at 85% 80%, #8DB57F 0 14%, rgba(141,181,127,0) 36%), linear-gradient(165deg, #F3F4EC 0%, #CFDDC4 100%)';
    const T = {"tarja":"O problema","linha1":"Podou e ela","linha2":"não","destaque":"floresceu?","texto":"A hortênsia forma os botões do ano que vem nos galhos de agora. Cortou na hora errada, levou as flores junto.","nota":"Calma, não é culpa sua.","contador":"2/8","legendaFoto":"galhos de hortênsia só com folhas, recorte fechado"};
    const tx = {};
    Object.keys(T).forEach(function (c) { tx[c] = p[c] ?? T[c]; });
    return Object.assign(tx, {mascote: m, temMascote: !!m, semMascote: !m, mostrarMascote: p.mostrarMascote ?? false, foto: f, temFoto: !!f, semFoto: !f, veu: 'rgba(11,20,16,' + k + ')', zoomTf: 'scale(' + z + ')', foco: foco, sim: p.simularFotoClara ? L : D });
  }
}
</script>
</body>
</html>
