name: Publish Instagram

# Quem dispara e o TriggerAll (cron e webhook de push da routine do Claude), nao um schedule aqui.
# Renomear este arquivo quebra o gatilho: o TriggerAll procura o workflow por este nome.
on:
  workflow_dispatch:
    inputs:
      dia:
        description: 'Dia do post (AAAA-MM-DD). Vazio = amanha em Brasilia'
        required: false
        type: string

permissions:
  contents: write

# Um por vez: o merge empurra na main e dois ao mesmo tempo se atropelariam.
concurrency:
  group: insta-rotina
  cancel-in-progress: false

jobs:
  mesclar:
    name: Validar e mesclar as branches da rotina
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # So aceita commit da conta claude e so arquivos de post e log (repo publico).
      # Refaz a conferencia dos fatos contra o livro antes de empurrar na main.
      - name: Mesclar
        env:
          GH_TOKEN: ${{ github.token }}
        run: node insta-terra-gentil/publicar/rotina/mesclar-cli.mjs

  previa:
    name: Renderizar a previa do dia
    needs: mesclar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (main ja com o merge)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: insta-terra-gentil/package-lock.json

      - name: Achar o post do dia
        id: post
        env:
          DIA_ENTRADA: ${{ inputs.dia }}
        run: |
          DIA="${DIA_ENTRADA:-$(TZ=America/Sao_Paulo date -d tomorrow +%F)}"
          if ! echo "$DIA" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "dia invalido: $DIA"; exit 1
          fi
          ARQUIVO="$(ls insta-terra-gentil/dados/posts/${DIA}-*.json 2>/dev/null | head -1 || true)"
          if [ -z "$ARQUIVO" ]; then
            echo "::notice::Sem post para $DIA, nada a renderizar."
            echo "tem=false" >> "$GITHUB_OUTPUT"
          else
            echo "tem=true" >> "$GITHUB_OUTPUT"
            echo "dia=$DIA" >> "$GITHUB_OUTPUT"
            echo "arquivo=${ARQUIVO#insta-terra-gentil/}" >> "$GITHUB_OUTPUT"
          fi

      # So instala (uns 3 min de Actions) quando ha post para renderizar.
      - name: Dependencias e Chromium
        if: steps.post.outputs.tem == 'true'
        working-directory: insta-terra-gentil
        timeout-minutes: 12
        run: |
          npm ci --no-audit --no-fund
          # O apt ja travou segurando o lock do dpkg: 3 tentativas, limpando o apt entre elas.
          ok=0
          for i in 1 2 3; do
            timeout -k 10 240 npx playwright-core install --with-deps chromium && ok=1 && break
            echo "tentativa $i falhou: limpando o apt preso"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock
            sudo dpkg --configure -a || true
          done
          [ "$ok" = 1 ]

      - name: Renderizar os 8 slides e a legenda
        if: steps.post.outputs.tem == 'true'
        working-directory: insta-terra-gentil
        run: node carrossel/cli.mjs "${{ steps.post.outputs.arquivo }}" "${{ steps.post.outputs.dia }}"

      - name: Legenda no resumo do run
        if: steps.post.outputs.tem == 'true'
        run: |
          {
            echo "## Legenda de ${{ steps.post.outputs.dia }}"
            echo
            cat "insta-terra-gentil/saida/${{ steps.post.outputs.dia }}/${{ steps.post.outputs.dia }}-legenda.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      # Pacote que o workflow "Postar Instagram" usa: JPEGs numerados, legenda e ficha, numa branch
      # propria (URL raw.githubusercontent.com). Branch separada: nao redeploya o site na Vercel.
      - name: Guardar o pacote na branch ig-slides
        if: steps.post.outputs.tem == 'true'
        run: |
          DIA="${{ steps.post.outputs.dia }}"
          SAIDA="insta-terra-gentil/saida/$DIA"
          PACOTE="$RUNNER_TEMP/pacote"
          mkdir -p "$PACOTE"
          i=1
          for f in $(ls "$SAIDA"/*.jpg | sort); do
            cp "$f" "$PACOTE/$(printf '%02d' $i).jpg"; i=$((i+1))
          done
          [ "$i" = 9 ] || { echo "esperava 8 JPEGs, achei $((i-1))"; exit 1; }
          cp "$SAIDA/$DIA-legenda.txt" "$PACOTE/legenda.txt"
          cp "$SAIDA/$DIA-ficha.json" "$PACOTE/ficha.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ig-slides >/dev/null; then
            git fetch origin ig-slides
            git worktree add -B ig-slides "$RUNNER_TEMP/ig" origin/ig-slides
          else
            git worktree add --orphan -b ig-slides "$RUNNER_TEMP/ig"
          fi
          cd "$RUNNER_TEMP/ig"
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          rm -rf "$DIA" && mkdir "$DIA" && cp "$PACOTE"/* "$DIA"/
          # Guarda so os 14 dias mais recentes.
          ls -d 20*/ 2>/dev/null | sort | head -n -14 | xargs -r rm -rf
          git add -A
          git commit -m "pacote do Instagram de $DIA" || echo "sem mudanca"
          git push origin ig-slides

      # A capa e o credito da foto vao para o site (public/noticias/<slug>/), junto da pagina da
      # noticia. So quando o post tem materia. O push na main faz a Vercel publicar a capa; o
      # workflow "Postar Instagram" so poe o link da noticia na legenda depois de ver a pagina no ar.
      - name: Capa da noticia no site
        if: steps.post.outputs.tem == 'true'
        run: |
          DIA="${{ steps.post.outputs.dia }}"
          cd "$GITHUB_WORKSPACE"
          node insta-terra-gentil/publicar/site/capa-noticia-cli.mjs \
            --post "insta-terra-gentil/${{ steps.post.outputs.arquivo }}" \
            --saida "insta-terra-gentil/saida/$DIA"
          if [ -n "$(git status --porcelain public/noticias)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/noticias
            git commit -m "site: capa da noticia de $DIA"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi

      - name: Guardar a previa (7 dias)
        if: steps.post.outputs.tem == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: carrossel-${{ steps.post.outputs.dia }}
          path: insta-terra-gentil/saida/${{ steps.post.outputs.dia }}/
          retention-days: 7
